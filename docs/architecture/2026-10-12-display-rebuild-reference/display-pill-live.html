<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Display pill: live mockup</title>
<style>
/* Colors, sizes and radii follow the app: src/gui/StyleConstants.h, the pill in
   src/gui/SpectrumOverlayPanel.cpp (268 wide, 22 tab, 18 control, 14 slider) and
   the Setup pages. The dashed box at the top is the mockup's own, as in the
   other mockups under docs/architecture. */
:root{--page:#05050c;--app:#0f0f1a;--panel:#0a0a18;--txt:#c8d8e8;--dim:#8090a0;--mut:#708090;--accent:#00b4d8;--title:#8aa8c0;--border:#304050;--amber:#ffb800}
*{box-sizing:border-box}
body{background:var(--page);color:var(--txt);font:12px -apple-system,system-ui,"Segoe UI",sans-serif;margin:0;padding:16px;user-select:none;-webkit-user-select:none}
.demo{background:#14141f;border:1px dashed #3a3a55;border-radius:6px;padding:8px 10px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:#aab;max-width:1420px}
.demo b{color:#dde;font-weight:600}
.demo select,.demo button{background:#1c1c2c;color:#dde;border:1px solid #3a3a55;border-radius:3px;padding:2px 6px;font-size:12px}
.demo label{display:inline-flex;gap:5px;align-items:center}
.try{color:#99a;font-size:11px;width:100%;line-height:1.5}
.try b{color:#ccd}
.stage{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.where{color:var(--title);font-size:11px;margin:0 0 5px 2px;letter-spacing:.03em;height:14px;white-space:nowrap}
.win{border:1px solid #203040;border-radius:6px;overflow:hidden;background:var(--app)}
.wtitle{height:26px;background:#1b1b28;display:flex;align-items:center;justify-content:center;color:#aab;font-size:12px;border-bottom:1px solid #000;position:relative}
.wtitle i{position:absolute;left:10px;top:8px;width:10px;height:10px;border-radius:5px;background:#ff5f57;box-shadow:16px 0 0 #febc2e,32px 0 0 #28c840}

/* ---------- main window ---------- */
.main{width:716px;overflow:visible}
#mainwhere{max-width:716px;overflow:hidden;text-overflow:ellipsis}
.pans{padding:6px 6px 0}
.pan{border:1px solid #203040;margin-bottom:6px;position:relative;background:var(--panel)}
.pan.sel{border-color:#0090e0}
.phead{height:18px;display:flex;align-items:center;gap:8px;padding:0 6px;font-size:10px;color:var(--dim);border-bottom:1px solid #182430}
.phead b{color:var(--txt)}
.phead .flag{margin-left:auto;color:#ffb800;font-weight:700}
.txb{background:#c02020;color:#fff;border-radius:2px;padding:0 4px;font-weight:700}
.pan canvas{display:block}
.ovl{position:absolute;left:4px;top:24px;display:flex;flex-direction:column;gap:2px}
.ob{height:18px;width:52px;background:rgba(20,30,45,.94);border:1px solid rgba(255,255,255,.157);border-radius:2px;color:var(--txt);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:default}
.ob.fake{color:#607080}
.ob.on{background:rgba(0,112,192,.706);border-color:#0090e0;color:#fff}
.ann{font-size:10px;color:#99a;font-style:italic;padding:3px 6px 4px;border-top:1px dashed #2a2a40;background:#101018}
.ann.stand{border:1px dashed #2a2a40;margin-bottom:6px;line-height:13px}
.nopan{height:150px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;border:1px solid #203040;margin-bottom:6px;background:var(--panel)}
.flynone{padding:14px 12px;color:#99a;font-size:10px;font-style:italic;line-height:14px}

/* ---------- pill flyout ---------- */
.fly{width:268px;background:rgba(15,15,26,.96);border:1px solid var(--border);border-radius:3px}
.fly.flash,.win.flash{animation:fl .9s}
@keyframes fl{0%{box-shadow:0 0 0 2px #ffb800}100%{box-shadow:0 0 0 2px transparent}}
.tabs{display:flex;gap:2px;padding:6px 8px 0}
.tab{flex:1 1 auto;padding:0 5px;height:22px;background:rgba(20,30,45,.94);border:1px solid rgba(255,255,255,.157);border-radius:2px;color:var(--txt);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:default}
.tab.on{background:rgba(0,112,192,.706);border-color:#0090e0;color:#fff}
.grid{display:grid;grid-template-columns:70px 22px 1fr 54px;column-gap:4px;row-gap:4px;padding:6px 8px;align-items:center}
.lbl{color:var(--dim);font-size:10px;white-space:nowrap;height:18px;display:flex;align-items:center;position:relative}
/* A label's dot sits in the pill's left margin, so the label keeps its whole column and does not move when the dot comes or goes. */
.lbl .dot,.seg .dot{position:absolute;left:-8px;top:50%;margin:-3.5px 0 0;box-shadow:none}
.val{color:var(--txt);font-size:10px;text-align:right;white-space:nowrap}
.lbl.dis,.val.dis{color:#4a5a6a}
.val.vbox{height:16px;background:#1a2a3a;border:1px solid var(--border);border-radius:2px;padding:0 3px;display:flex;align-items:center;justify-content:flex-end}
.val.vbox.dis{background:#141e28;border-color:#243444}
.dot{width:7px;height:7px;border-radius:4px;background:var(--amber);margin-right:4px;flex:none;cursor:pointer;box-shadow:0 0 0 2px rgba(255,184,0,.18)}
.hdr{grid-column:1/5;display:flex;align-items:center;gap:6px;margin-top:8px;min-height:12px}
.hdr.first{margin-top:0}
.hdr .t{color:var(--accent);font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase}
.hdr .line{flex:1;height:1px;background:var(--border)}
.hdr .scope{color:var(--mut);font-size:9px;font-weight:700;letter-spacing:.4px}
.sl{position:relative;height:14px;cursor:pointer}
.sl .g{position:absolute;left:0;right:0;top:5px;height:4px;background:#203040;border-radius:2px}
.sl .h{position:absolute;top:2px;width:10px;height:10px;margin-left:-5px;background:var(--accent);border-radius:5px}
.sl.dis{cursor:default}.sl.dis .h{background:#3a4a5a}.sl.dis .g{background:#1a2430}
.sl.noh .h{display:none}
.pill{height:18px;min-width:36px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;background:#1a2a3a;border:1px solid #205070;border-radius:3px;color:var(--txt);font-size:10px;font-weight:700;white-space:nowrap;cursor:default;position:relative}
.pill.on{background:#006040;color:#00ff88;border-color:#00a060}
.pill.dis{background:#141e28;color:#4a5a6a;border-color:#243444}
.pill.dis.on{color:#4f7a66}
.pill.mini{min-width:0;width:22px;padding:0;font-size:9px;justify-self:center}
.pill .dot{position:absolute;right:-4px;top:-4px;margin:0}
.pills{grid-column:1/5;display:flex;flex-wrap:wrap;gap:4px}
.cmb{grid-column:2/5;height:18px;background:#1a2a3a;border:1px solid var(--border);border-radius:3px;color:var(--txt);font-size:10px;padding:0 6px;display:flex;align-items:center;justify-content:space-between;cursor:default}
.cmb.c2{grid-column:3/5}
.cmb.dis{background:#141e28;color:#4a5a6a;border-color:#243444}
.arr{color:var(--mut);font-size:8px}
.sw{width:18px;height:12px;border:1px solid #607080;border-radius:2px;cursor:pointer;justify-self:center}
.sw.dis{opacity:.3;cursor:default}
.swc{position:relative;justify-self:center;display:flex}
.swc .dot{position:absolute;right:-4px;top:-4px;margin:0}
.btn{height:18px;padding:0 8px;background:#1a3050;color:var(--txt);border:1px solid var(--border);border-radius:2px;font-size:10px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;cursor:default}
.btn.dis{background:#141e28;color:#4a5a6a;border-color:#243444}
.note{grid-column:1/5;color:var(--mut);font-size:9px;line-height:12px}
.note.hi{color:var(--title)}
.note.amber,.snote.amber{color:var(--amber)}
.note.two{min-height:24px}
.note.dim{color:#4a5a6a}
.snote.dim,.snote.plain.dim{color:#556070}
.chip{display:inline-block;width:22px;height:10px;border:1px solid #607080;border-radius:2px;vertical-align:-1px}
.noteb{grid-column:1/5;display:flex;gap:6px;align-items:flex-start;min-height:24px}
.noteb .note{flex:1}
.brow{grid-column:2/5;display:flex;gap:4px}
.lnk{color:var(--accent);cursor:pointer;white-space:nowrap}
.why{grid-column:1/5;color:var(--mut);font-size:9px;line-height:12px;height:41px;overflow:hidden;margin-top:6px;padding-top:4px;border-top:1px solid #1c2836}
.why.amber{color:var(--amber)}
.sep{grid-column:1/5;height:1px;background:var(--border);margin:0 0 2px}
.foot{grid-column:1/5;display:flex;align-items:center;justify-content:space-between}
/* One width, wide enough for the longest count, so the button does not change size when a dot comes or goes. */
.foot .btn{width:120px;padding:0}
.link{color:var(--accent);font-size:10px;cursor:pointer}
.seg{grid-column:1/5;display:flex;gap:2px;align-items:center;position:relative}
.seg .s{flex:1;height:18px;background:rgba(20,30,45,.94);border:1px solid rgba(255,255,255,.157);border-radius:2px;color:var(--txt);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:default;white-space:nowrap}
.seg .s.on{background:rgba(0,112,192,.706);border-color:#0090e0;color:#fff}
.seg.dis .s{background:#141e28;color:#4a5a6a;border-color:#243444}
.seg.dis .s.on{background:#243444;color:#8090a0}

/* ---------- Setup ---------- */
.setupw{width:664px}
.dlg{display:flex;min-height:600px}
.tree{width:136px;flex:none;background:#131326;padding:4px 0;border-right:3px solid var(--border);font-size:12px;color:#9aa8b8}
.tree div{padding:2px 8px;min-height:19px;line-height:15px;white-space:nowrap}
.tree .cat::before{content:"\25B8  ";color:var(--title)}.tree .cat.open::before{content:"\25BE  "}
.tree .leaf{padding-left:24px;cursor:pointer}
.tree .leaf.sel{background:#00b4d8;color:#fff}
.spage{flex:1;padding:10px 12px 14px;min-width:0}
.spage h1{font-size:15px;font-weight:700;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.for{display:flex;align-items:center;gap:3px;margin-bottom:6px}
.forl{font-size:12px;color:var(--txt);margin-right:4px;white-space:nowrap}
.ft{position:relative;height:32px;padding:0 8px;white-space:nowrap;background:#1a2a3a;border:1px solid var(--border);border-radius:3px;font-size:12px;line-height:13px;color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default}
.ft.off{color:#5a6a7a;border-style:dashed}
.ft.on{background:#0070c0;border-color:#0090e0;color:#fff;font-weight:600}
.ft .d{position:absolute;right:-3px;top:-3px;width:7px;height:7px;border-radius:4px;background:var(--amber)}
.ft .sl2{font-size:10px;line-height:11px;opacity:.75;font-weight:400}
.banner{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:6px 8px;border:1px solid var(--border);border-radius:3px;background:var(--panel);font-size:11.5px;color:var(--txt);min-height:36px}
.banner.pan{border-color:#906000}
.gb{position:relative;border:1px solid #205070;border-radius:4px;margin-top:16px;padding:14px 10px 8px}
.gb>.gt{position:absolute;top:-8px;left:8px;background:var(--app);padding:0 4px;font-size:11px;font-weight:700;color:var(--title)}
.gb>.gtag{position:absolute;top:-7px;right:8px;background:var(--app);padding:0 4px;font-size:9px;font-weight:700;color:var(--mut);letter-spacing:.4px}
.srow{display:grid;grid-template-columns:118px minmax(0,1fr) 72px 176px;column-gap:8px;align-items:center;min-height:26px;margin-bottom:2px}
.srow .l{font-size:12px;color:var(--txt);display:flex;align-items:center;white-space:nowrap}
.srow.dis .l{color:#556070}
.ssl{position:relative;height:16px;cursor:pointer}
.ssl .g{position:absolute;left:0;right:0;top:6px;height:4px;background:#1a2a3a;border-radius:2px}
.ssl .f{position:absolute;left:0;top:6px;height:4px;background:var(--accent);border-radius:2px}
.ssl .h{position:absolute;top:2px;width:12px;height:12px;margin-left:-6px;background:var(--accent);border-radius:6px}
.srow.dis .ssl{cursor:default}.srow.dis .ssl .f,.srow.dis .ssl .h{background:#3a4a5a}
.ssl.noh .h,.ssl.noh .f{display:none}
.spin{height:24px;background:#1a2a3a;border:1px solid var(--border);border-radius:3px;font-size:12px;color:var(--txt);display:flex;align-items:center;justify-content:flex-end;padding:0 8px;white-space:nowrap}
.srow.dis .spin{background:#1a1a2a;color:#556070;border-color:#2a3040}
.spin.cmbx{justify-content:space-between;grid-column:2/4;cursor:default}
.whyc{font-size:10.5px;color:var(--mut);line-height:12px;padding:1px 0}
.srow.dis .whyc{color:#9a8450}
.ownline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-1px 0 5px 14px;font-size:11px;line-height:14px;color:var(--amber)}
.ownline .sbtn{flex:none}
.sbtn{height:22px;padding:0 9px;background:#1a2a3a;border:1px solid var(--border);border-radius:3px;font-size:11px;color:var(--txt);display:inline-flex;align-items:center;white-space:nowrap;cursor:default}
.sbtn.dis{background:#1a1a2a;color:#556070;border-color:#2a3040}
.sseg{display:flex;gap:2px;margin:0 0 5px;align-items:center}
.sseg .s{flex:1;height:24px;background:#1a2a3a;border:1px solid var(--border);border-radius:3px;font-size:12px;color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:default;white-space:nowrap}
.sseg .s.on{background:#0070c0;border-color:#0090e0;color:#fff;font-weight:600}
.sseg.dis .s{background:#1a1a2a;color:#556070;border-color:#2a3040}
.sseg.dis .s.on{background:#2a3a4a;color:#8090a0}
.snote{font-size:11px;color:var(--title);margin:0 0 6px;line-height:15px}
.snote.plain{color:var(--mut)}
.mnote{font-size:10px;color:#99a;font-style:italic;margin:2px 0 4px}
.cbadge{flex:none;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #243444;border-radius:2px;background:#141e28;color:#4a5a6a;font-size:10px;font-weight:700;cursor:default}
.cbadge.act{background:#006040;color:#00ff88;border-color:#00a060}
.cbadge.pau{background:#4a3800;color:#ffcc44;border-color:#d4a017}
.spin.box{grid-column:2/4;width:118px;justify-content:space-between;gap:6px;padding-right:4px}
.spin.box .st{display:flex;flex-direction:column;font-size:7px;line-height:9px;color:var(--mut)}
.spin.box .st span{cursor:pointer;padding:0 3px}
.srow.dis .spin.box .st span{cursor:default}
.rdo{font-size:12px;color:var(--txt);margin:0 0 6px;display:flex;gap:18px}
.rdo b{font-weight:400;background:#0a0a18;border:1px solid var(--border);border-radius:2px;padding:1px 8px;margin-left:6px;color:#ffe4c4}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt);min-height:22px;cursor:default;grid-column:2/4}
.chk i{width:14px;height:14px;background:#1a2a3a;border:1px solid var(--border);border-radius:2px;display:inline-block;flex:none}
.chk.on i{background:var(--accent);border-color:var(--accent)}
.srow.dis .chk{color:#556070}
.srow.dis .chk i{background:#1a1a2a;border-color:#2a3040}
.srow.dis .chk.on i{background:#3a4a5a}
.ssw{width:46px;height:18px;border:1px solid #607080;border-radius:3px;cursor:pointer}
.srow.dis .ssw{opacity:.3;cursor:default}
.sswt{font-size:11px;color:var(--mut)}
/* popup list */
.pop{position:absolute;z-index:9;background:#1a2a3a;border:1px solid #406080;border-radius:3px;color:var(--txt);font-size:11px;padding:2px 0;box-shadow:0 8px 24px #000a}
.pop div{padding:3px 12px 3px 8px;white-space:nowrap;cursor:default}
.pop div:hover,.pop div.cur{background:#00b4d8;color:#fff}

/* ---------- the live mockup ---------- */
body{padding:12px}
.stage{flex-wrap:nowrap}
.setupcol{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;flex:0 0 auto}
.pan canvas{cursor:crosshair}
.pbody{position:relative}
.pbody .ovl{top:6px;z-index:2}
.ob{cursor:pointer}
.pbody .fly{position:absolute;left:62px;top:4px;z-index:6;box-shadow:0 6px 22px rgba(0,0,0,.65)}
#park{display:none}
.try summary{cursor:pointer;color:#ccd;font-weight:600}
.zs{position:absolute;left:4px;bottom:36px;display:flex;gap:2px;z-index:2}
.zb{width:24px;height:20px;background:rgba(20,30,45,.78);border:1px solid rgba(255,255,255,.157);border-radius:2px;color:var(--txt);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.zb:hover{background:rgba(0,112,192,.706);border-color:#0090e0}
.mm{margin:0 6px 6px;border:1px solid #203040;background:var(--panel)}
.mmh{height:18px;display:flex;align-items:center;gap:8px;padding:0 6px;font-size:10px;color:var(--dim);border-bottom:1px solid #182430}
.mmh b{color:var(--txt);font-size:11px}
.mmh span{margin-left:auto}
.mm canvas{display:block}
input.num{font-family:inherit;color:var(--txt);text-align:right;outline:none;user-select:text;-webkit-user-select:text;min-width:0;margin:0}
input.num:focus{border-color:#0090e0}
input.val.vbox.num{display:block;width:100%;font-size:10px;height:16px;padding:0 3px}
input.spin.num{display:block;width:100%;font-size:12px}
.spin.box input.num{background:none;border:0;padding:0;flex:1;width:10px;font-size:12px}
.pop.box{padding:8px;width:216px}
.pop.box div{padding:0;white-space:normal}
.pop.box div:hover{background:none;color:inherit}
.pop.box .ptit{font-weight:700;color:var(--title);margin-bottom:6px}
.swg{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:6px}
.swb{display:block;height:20px;border:1px solid #607080;border-radius:2px;cursor:pointer}
.swb.cur{box-shadow:0 0 0 2px #fff}
.pop.box .pbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;height:22px;padding:0 8px;margin-top:4px;background:#14202c;border:1px solid var(--border);border-radius:3px;cursor:pointer}
.pop.box .pbtn:hover,.pop.box .pbtn.cur{background:#0070c0;color:#fff}
.pbtn input[type=color]{width:34px;height:16px;padding:0;border:0;background:none}

.picg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pop.box .picb{border:1px solid var(--border);border-radius:3px;padding:2px;cursor:pointer;font-size:10px;text-align:center;overflow:hidden;text-overflow:ellipsis}
.pop.box .picb:hover,.pop.box .picb.cur{border-color:#0090e0;background:#0b2a44}
.picb canvas{display:block;width:100%;height:42px}
.gwrap{padding:3px 0}
.gstrip{position:relative;height:18px;border:1px solid var(--border);border-radius:2px;cursor:copy}
.gstrip canvas{display:block;width:100%;height:16px}
.gstrip.dis{opacity:.35;cursor:default}
.gh{position:absolute;top:-3px;width:9px;height:22px;margin-left:-5px;border:1px solid #fff;border-radius:2px;box-shadow:0 0 0 1px #000;cursor:ew-resize}
.gstrip.dis .gh{cursor:default}
.gl{display:flex;justify-content:space-between;font-size:9px;color:var(--mut);margin-top:2px}
.modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center}
.mbox{width:430px;background:#1b1b28;border:1px solid #406080;border-radius:6px;box-shadow:0 12px 40px #000;padding:14px 16px}
.mt{font-weight:700;font-size:13px;margin-bottom:8px}
.mb{font-size:12px;line-height:17px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.mf .sbtn{cursor:pointer;min-width:64px;justify-content:center}
.sbtn.def{border-color:#0090e0;background:#0070c0;color:#fff}
.tree .treenote{white-space:normal;color:var(--mut);font-size:10px;line-height:13px;margin-top:12px}
#selftest{white-space:pre-wrap;font:11px ui-monospace,monospace;color:#cde;background:#101820;border:1px solid #304050;padding:8px;margin:0 0 10px;user-select:text;-webkit-user-select:text}
</style></head><body>

<div class="demo">
 <b>Mockup controls (not part of the app):</b>
 <label>Radio <select id="radio">
  <option value="5">ANAN-G2 (runs up to 5 pans)</option>
  <option value="4">Hermes, ANAN-10/100 (up to 4 pans)</option>
  <option value="2">Hermes Lite 2 (up to 2 pans)</option>
 </select></label>
 <label>Situation <select id="sit">
  <option value="rx">Receiving</option>
  <option value="tx">Transmitting on Pan 1</option>

// ---------- the multimeter ----------
function drawMeter() {

  x.setTransform(DPR, 0, 0, DPR, 0, 0); x.fillStyle = "#0a0a18"; x.fillRect(0, 0, W, Hh);
  const live = p !== null && sit() !== "off" && METER.val !== null && !keyed(p);
  $("mmh").innerHTML = p === null ? "Multimeter" : `Multimeter &middot; Slice ${PAN[p].slice} signal <b>${live ? esc(meterText(METER.val)) : keyed(p) ? "transmitting" : "no signal"}</b><span>history: ${(glob.mmHistDur / 1000).toFixed(glob.mmHistDur % 1000 ? 1 : 0)} s</span>`;
  // The history graph: the readings of the last History duration, S0 at the bottom to S9+40 dB at the top.
  x.strokeStyle = "rgba(255,255,255,.08)"; x.fillStyle = "#607080"; x.font = "9px sans-serif"; x.textAlign = "left";
  for (const [d, l] of [[-121, "S1"], [-97, "S5"], [-73, "S9"], [-53, "+20"]]) { const y = Math.round(Hh * (-33 - d) / 94) + .5; x.beginPath(); x.moveTo(24, y); x.lineTo(W, y); x.stroke(); x.fillText(l, 2, y + 3); }
  if (!live) { return; }

// ---------- the pans in the main window ----------
const ZOOMS = [["S", "Segment zoom: fit the band plan segment the slice is in"], ["B", "Band zoom: fit the whole amateur band"], ["-", "Zoom out: show more bandwidth"], ["+", "Zoom in: show less bandwidth"]];
// A pan opens with its waterfall full and its measured levels settled, as a pan that has been running does.
let primeFrames = 270;
function prime(p) { for (let i = 0; i < primeFrames; i++) { simFrame(p, 1000 / 30); } }
function panInfo(p) {
  const s = SIM[p], e = $("frq" + p); if (!s || !e) { return; }
  const v = analyzer(p, keyed(p));
  e.textContent = `${mhzOf(p, v.f0 + v.span / 2).toFixed(4)} MHz · ${(v.span / 1000).toFixed(v.span < 20000 ? 1 : 0)} kHz wide`;
}
function buildPans() {

  if (!PANS.length) { $("pans").innerHTML = `<div class="nopan">No pan is open.</div>`; return; }
  $("pans").innerHTML = PANS.map(p => `<div class="pan" id="pan${p}"><div class="phead"><b>Pan ${p}</b><span>${PAN[p].band}</span><span id="frq${p}"></span><span class="txb" id="txb${p}" style="display:none">TX</span><span class="flag">Slice ${PAN[p].slice}</span></div>` +
    `<div class="pbody" id="pb${p}"><canvas id="cv${p}" data-cv="${p}" width="${PW * DPR}" height="${PH * DPR}" style="width:${PW}px;height:${PH}px"></canvas>` +
    `<div class="ovl">${ui.collapsed[p] ? `<div class="ob nar" data-collapse="${p}" title="Show the pan's buttons">&#9654;</div>`
      : `<div class="ob nar" data-collapse="${p}" title="Hide the pan's buttons">&#9664;</div><div class="ob" data-pan="${p}" id="ob${p}" title="Display settings for this pan">Display</div>`}</div>` +
    `<div class="zs">${ZOOMS.map(([z, tip]) => `<div class="zb" data-zoom="${z}" data-p="${p}" title="${tip}">${z}</div>`).join("")}</div></div></div>`).join("");
  for (const p of PANS) { $("cv" + p).addEventListener("wheel", e => panWheel(e, p), {passive: false}); }
}
// The pill opens over its pan, beside the Display button, as in the app.
function mountPill() {
  const f = $("fly"), p = ui.pill, home = p !== null && ui.pillOpen && !ui.collapsed[p] ? $("pb" + p) : null;
  if (!home) { $("park").appendChild(f); } else if (f.parentNode !== home) { home.appendChild(f); }
}
const curPan = e => { const c = e.target.closest("canvas[data-cv]"); return c ? +c.dataset.cv : null; };
const atOf = (e, p) => { const r = $("cv" + p).getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; };
// Shift the receive scale: both ends together, or dB Max alone while Track floor has dB Min.
function shiftScale(p, db) {

  const mx = rd(p, "dbMax"), mn = rd(p, "dbMin");
  if (gateOf(p, "dbMin")) { if (!gateOf(p, "dbMax")) { put(p, "dbMax", Math.max(-200, Math.min(0, mx + db))); } return; }
  const d = db > 0 ? Math.min(db, 0 - mx) : Math.max(db, -200 - mn);
  if (d > 0) { put(p, "dbMax", mx + d); put(p, "dbMin", mn + d); } else { put(p, "dbMin", mn + d); put(p, "dbMax", mx + d); }
}
function zoomBy(p, f) { const s = SIM[p]; s.span = s.span * f; clampView(s); s.dirty = true; panInfo(p); }
function zoomFit(p, lo, hi) { const s = SIM[p]; s.span = hi - lo; clampView(s); s.off = (lo + hi) / 2; clampView(s); s.dirty = true; panInfo(p); }
function panWheel(e, p) {

  const s = SIM[p], a = atOf(e, p), up = d < 0;
  // As the app has it (SpectrumWidget::wheelEvent): over the dBm strip the wheel moves the top of the scale 5 dB;
  // Ctrl or Cmd with the wheel zooms around the slice; Shift with the wheel shifts the whole scale 5 dB.
  // The plain wheel tunes the radio in the app; here it scrolls the page.
  if (a.y < lay(s).sph && a.x >= PW - STRIPW && rd(p, "dbmstrip")) {
    e.preventDefault();
    if (!keyed(p) && !gateOf(p, "dbMax")) { put(p, "dbMax", Math.max(-200, Math.min(0, rd(p, "dbMax") + (up ? -5 : 5)))); render(); }
  }

// The divider between the spectrum and the waterfall is the top edge of the frequency scale. As in the app, a

const onDivider = (a, L) => a.y >= L.sph - 6 && a.y < L.sph + 10;
let dragging = false;
document.addEventListener("mousedown", e => {
  const p = curPan(e);

  } else if (a.y >= L.sph && a.y < L.wfy) {

    const b0 = s.back;

let lastXY = null;
document.addEventListener("mousemove", e => {

  // The pointer shows what a drag would do here.

      : a.y < L.sph && a.x >= PW - STRIPW && rd(p, "dbmstrip") ? "ns-resize" : a.y >= L.sph && a.y < L.wfy ? "ew-resize"
      : a.y >= L.wfy && a.x >= PW - stripW(s) ? "ns-resize" : "";
  }
});
document.addEventListener("click", e => {

// ---------- number boxes ----------

  5: () => { own[3] = {view: "3d", bg: true, bgpic: "Aurora.jpg"}; ui.tab = "View"; ui.page = "View"; ui.setupFor = 3; },
  6: () => { shared.pt = true; shared.pm = true; shared.pmHold = true; own[2] = {peakv: true, nf: true}; ui.tab = "Spectrum"; ui.page = "Peaks & Markers"; },
  7: () => { glob.sizing = "hzbin"; ui.tab = "FFT"; ui.page = "FFT & Engine"; },
  8: () => { $("sit").value = "off"; ui.tab = "FFT"; },
  9: () => { ui.page = "Multimeter"; ui.tab = "Waterfall"; },
  10: () => { $("sit").value = "tx"; ui.pill = 1; ui.setupFor = 1; },
  11: () => { $("radio").value = "2"; startOver(); buildPans(); own[2] = {low: -104, mode: "manual"}; ui.page = "Spectrum"; ui.tab = "Spectrum"; },
  12: () => { own[3] = {nb: true, stamp: "Left", rate: 60}; ui.tab = "Waterfall"; ui.page = "Waterfall"; ui.setupFor = 3; },
  13: () => { own[3] = {bg: true, bgpic: "Night sky.png"}; ui.tab = "View"; ui.page = "View"; },
  14: () => { $("sit").value = "remoteold"; ui.tab = "FFT"; ui.page = "Transmit Display"; },
  15: () => { $("sit").value = "gpu"; own[3] = {view: "3d"}; ui.tab = "View"; ui.page = "View"; ui.setupFor = 3; },
  16: () => { $("sit").value = "nopan"; ui.page = "Levels"; },
  17: () => { $("sit").value = "off"; ui.tab = "Levels"; ui.page = "Levels"; },
  18: () => { $("txscope").value = "pan"; $("sit").value = "tx"; ui.pill = 1; ui.setupFor = 1; },
  19: () => { $("rule").value = "keep"; own[3] = {opacity: 50, nb: true}; own[1] = {opacity: 70}; ui.tab = "Waterfall"; ui.page = "Waterfall"; },
  20: () => { own[3] = {view: "3d", peakhold: true}; ui.tab = "Spectrum"; ui.page = "Spectrum"; ui.setupFor = 3; },
};
const demo = new URLSearchParams(location.search).get("demo");
if (DEMOS[demo]) { DEMOS[demo](); settleRule(); radioChanged(); }
render();
startLoop();

// ---------- ?selftest: the page checks itself (not part of the mockup JJ uses) ----------
// 1. Every situation, tab, page and "Settings for" choice draws without an error.
// 2. Every row changes the picture: with the row's parents on, a different value gives a different pan or meter.
function selfTest() {
  if (!new URLSearchParams(location.search).has("selftest")) { return; }
  const out = [], err = (w, e) => out.push("ERROR " + w + ": " + (e && e.stack ? e.stack.split("\n").slice(0, 3).join(" | ") : e));
  const t0 = performance.now();
  for (const o of [...$("sit").options]) {
    const s = o.value;
    $("sit").value = s; try { radioChanged(); } catch (e) { err("sit " + s, e); }
    for (const tab of TABS) { ui.tab = tab; try { render(); } catch (e) { err(`sit ${s} tab ${tab}`, e); } }
    for (const pg of PAGES) { for (const f of ["all", 1, 2, 3, 4]) { ui.page = pg.name; ui.setupFor = f; try { render(); } catch (e) { err(`sit ${s} page ${pg.name} for ${f}`, e); } } }
    for (const p of PANS) { try { for (let i = 0; i < 12; i++) { simFrame(p, 33); } drawPan(p); } catch (e) { err(`sit ${s} frame pan ${p}`, e); } }
  }
  out.push(`sweep done in ${Math.round(performance.now() - t0)} ms`);
  // The effect check. A context turns the parents on; the row is then changed and the pan run again from the same start.
  const realNow = Date.now; Date.now = () => 1.7e12;
  const P = 1; primeFrames = 0;
  const ON = {fill: true, peakhold: true, pt: true, ptFill: true, pm: true, pmHold: true, pmDecay: true, peakv: true, nf: true, binw: true, fpsov: true, cursor: true,
    bg: true, bgpic: "Aurora.jpg", grid: true, stamp: "Left", nb: true, rxfilt: true, txfilt: true, rxzero: true, txzero: true, zeroline: true, dbmstrip: true};
  const CTX = {
    plain: {},
    on: {...ON, det: "Average", avg: "Recursive", wfavg: "Recursive", mode: "manual", dbMax: 0, dbMin: -140},
    onpeak: {...ON, det: "Peak", avg: "None", wfavg: "Time Window", mode: "auto", scheme: "Custom", sizing: "fixed", pmIn: true},
    track: {...ON, scalemode: "track", mode: "floor", avg: "Time Window", sizing: "hzbin", hzbin: 23.5},
    keep: {scalemode: "track", keeprange: true, mode: "scale"},
    clarity: {mode: "clarity", fill: false, linecolor: "#ffffff"},
    d3: {view: "3d", shadow3d: false},
    tx: {sit: "tx", ...ON, pt: true, ptTx: false, stoptx: false, txdet: "Average", txavg: "Recursive", txwfavg: "Recursive", txpal: "Custom"},
    tx2: {sit: "tx", txMax: 20, txMin: -80, stoptx: true, pt: true, ptTx: true, txavg: "Time Window", txwfavg: "Time Window"},
    // A new FFT Size at the end starts the fast attack, the only time its color is drawn.
    fast: {nf: true, sizing: "fixed", _fft: 8192},
    // Rewind shows once more than a minute of rows is stored.
    long: {_frames: 2100},
    // Thirty seconds holds several noise bursts of different strengths.
    bursts: {nb: true, _frames: 900},
  };
  // Contexts that are run for their own rows only.
  const ONLY = {fast: ["nffast"], long: ["rewind"], bursts: ["nb", "nbdb"]};
  // Rows that draw nothing by design: Text Position is kept and not used, and Thread Priority is how this
  // computer schedules the display thread.
  const NO_PICTURE = ["nfpos", "threadprio"];
  const alt = (k, v) => {
    const c = CTL[k];
    if (c.t === "tg") { return !v; }
    if (c.t === "cb" || c.t === "seg") { const o = c.opts.map(x => Array.isArray(x) ? x[0] : x); return o[(o.indexOf(v) + 1) % o.length]; }
    if (c.t === "col") { return v === "#ff00ff" ? "#00ff00" : "#ff00ff"; }
    if (c.t === "pic") { return v === "Shack.jpg" ? "Aurora.jpg" : "Shack.jpg"; }
    if (c.map) { return c.map[(c.map.indexOf(v) + 2) % c.map.length]; }
    const lo = c.min, hi = c.slMax || c.max, mid = (lo + hi) / 2, want = v > mid ? lo + (hi - lo) * 0.2 : lo + (hi - lo) * 0.8;
    return +(Math.round(want / c.step) * c.step).toFixed(2);
  };
  const finger = () => {
    const cv = $("cv" + P), d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data; let h = 2166136261;
    for (let i = 0; i < d.length; i += 8) { h = Math.imul(h ^ d[i], 16777619); h = Math.imul(h ^ d[i + 1], 16777619); h = Math.imul(h ^ d[i + 2], 16777619); }
    return (h >>> 0) + "|" + (METER.val === null ? "" : meterText(METER.val)) + "|" + METER.hist.length + "|" + $("mmh").textContent + "|" + SIM[P].rows.length;
  };
  const setCtx = ctx => { for (const [kk, v] of Object.entries(ctx)) { if (kk !== "sit" && kk[0] !== "_") { put(P, kk, v, true); } } };
  const run = (ctx, k, useAlt) => {
    $("sit").value = ctx.sit || "rx"; startOver(); ui.pill = P;
    setCtx(ctx);
    if (k) { const v = rd(P, k); put(P, k, useAlt ? alt(k, v) : v, true); }
    PANS = openPans(); buildPans();
    const s = SIM[P]; s.cur = {x: 300, y: 60};
    for (let i = 0; i < (ctx._frames || 150); i++) { simFrame(P, 33.3); meterStep(33.3); }
    if (ctx._fft) { put(P, "fftsize", ctx._fft, true); for (let i = 0; i < 6; i++) { simFrame(P, 33.3); } }
    s.cur = {x: 300, y: 60}; drawPan(P); drawMeter();
    return finger();
  };
  const dead = [], seen = {};
  for (const k of Object.keys(CTL)) {
    if (NO_PICTURE.includes(k)) { continue; }
    let hit = null;
    for (const [name, ctx] of Object.entries(CTX)) {
      if (ONLY[name] && !ONLY[name].includes(k)) { continue; }
      try {
        // A row that is gray in this context cannot be judged here.
        $("sit").value = ctx.sit || "rx"; startOver(); setCtx(ctx);
        if (gateOf(P, k)) { continue; }
        const base = seen[name + "|" + k] = run(ctx, k, false), other = run(ctx, k, true);
        if (base !== other) { hit = name; break; }
      } catch (e) { err(`effect ${k} in ${name}`, e); }
    }
    if (!hit) { dead.push(k); }
  }
  Date.now = realNow; primeFrames = 270;
  out.push(`rows with no effect in any context (${dead.length}): ${dead.join(", ") || "none"} (not judged, nothing to draw: ${NO_PICTURE.join(", ")})`);
  out.push(`effect check done in ${Math.round(performance.now() - t0)} ms`);
  $("sit").value = "rx"; startOver(); radioChanged();
  document.body.insertAdjacentHTML("afterbegin", `<pre id="selftest">${esc(out.join("\n"))}</pre>`);
}
selfTest();
</script>
