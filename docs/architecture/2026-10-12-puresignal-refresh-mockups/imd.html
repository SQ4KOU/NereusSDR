#imd-pan-study .ip-selection&gt;span:last-child{margin-left:auto}
#imd-pan-study .ip-message{margin:0 14px 12px;padding:10px 12px;background:#29211b;color:#deb98a;border-radius:4px;font-size:11px}

#imd-pan-study .ip-expanded{border-top:1px solid var(--ip-line);padding:12px 15px;color:var(--ip-muted)}

#imd-pan-study .ip-expanded[open] summary{margin-bottom:13px}

#imd-pan-study .ip-third{color:var(--ip-third)}
#imd-pan-study .ip-fifth{color:var(--ip-fifth)}

#imd-pan-study .ip-detail-summary&gt;div{display:flex;flex-direction:column;gap:6px;color:var(--ip-muted);font-size:11px}

  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
