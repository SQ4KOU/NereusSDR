<div id="imd-pan-study" aria-label="Two-tone IMD panadapter design study">
  <div class="viz-carousel viz-dotted-background" aria-label="IMD spectrum and waterfall treatments">
    <section data-variant="Measurement rail"><div class="ip-stage"><div class="ip-window" data-layout="rail" aria-label="IMD measurement rail"></div></div></section>
    <section data-variant="Bench inspector" hidden><div class="ip-stage"><div class="ip-window" data-layout="inspector" aria-label="IMD bench inspector"></div></div></section>
  </div>
  <template id="ip-template">
    <header class="ip-title"><span><i data-lucide="radio" aria-hidden="true"></i> NereusSDR · Pan A</span><span>Design study · synthetic RF</span></header>
    <div class="ip-panbar"><div class="ip-vfo"><span>A</span><strong>14.200000</strong><small>MHz · USB</small></div><div class="ip-tags"><span>TWO-TONE</span><span>700 / 1900 Hz</span><label><input type="checkbox" checked data-enabled> IMD overlay</label></div></div>
    <div class="ip-demo-controls"><div class="ip-demo-switch"><span>Preview correction</span><button type="button" data-ps="on" aria-pressed="true" class="cursor-interaction">Applied</button><button type="button" data-ps="off" aria-pressed="false" class="cursor-interaction">Off</button></div><select data-state aria-label="Preview measurement condition"><option value="valid">Valid measurement</option><option value="missing">IMD5 peaks missing</option><option value="cropped">Products outside view</option><option value="waiting">Waiting for TX</option></select></div>
    <div class="ip-workspace">
      <div class="ip-plot-area">
        <div class="ip-rail"><div class="ip-measure-state"><span data-status class="ip-green">● Valid peaks</span><small>Current spectrum · EMA</small></div><div><span>WORST IMD3</span><strong data-imd3>−48.2 <small>dBc</small></strong></div><div><span>WORST IMD5</span><strong data-imd5>−61.7 <small>dBc</small></strong></div><button type="button" data-guides aria-pressed="true" class="ip-quiet cursor-interaction"><i data-lucide="scan-line" aria-hidden="true"></i> Guides</button></div>
        <div class="ip-spectrum-wrap"><div class="ip-caption"><span>TX feedback spectrum</span><span>dBm</span></div><canvas data-spectrum role="img" aria-label="Synthetic two-tone spectrum showing lower and upper fundamentals and third and fifth order intermodulation products"></canvas></div>
        <div class="ip-waterfall-wrap"><div class="ip-caption"><span>Waterfall history</span><span>Newest at top · guides show frequency</span></div><canvas data-waterfall role="img" aria-label="Synthetic waterfall with brighter uncorrected products below a correction event and weaker corrected products above it"></canvas></div>
        <div class="ip-product-picker" aria-label="Inspect a tone or intermodulation product"><button type="button" data-product="0" class="cursor-interaction">IMD5 L</button><button type="button" data-product="1" aria-pressed="true" class="cursor-interaction">IMD3 L</button><button type="button" data-product="2" class="cursor-interaction">Tone L</button><button type="button" data-product="3" class="cursor-interaction">Tone U</button><button type="button" data-product="4" class="cursor-interaction">IMD3 U</button><button type="button" data-product="5" class="cursor-interaction">IMD5 U</button></div>
        <div class="ip-selection" aria-live="polite"><span data-selected-name>IMD3 L</span><strong data-selected-freq>14.199500 MHz</strong><span data-selected-level>−68.2 dBm · −48.2 dBc</span><span class="ip-muted" data-selected-state>Measured peak</span></div>
        <div class="ip-message" data-message hidden aria-live="polite"></div>
      </div>
      <aside class="ip-inspector" aria-label="Detailed IMD readings">
        <div class="ip-inspector-title"><span>Two-tone measurements</span><span class="ip-green" data-detail-status>Valid</span></div>
        <div class="ip-detail-summary"><div><span>Worst IMD3</span><strong data-imd3>−48.2 <small>dBc</small></strong></div><div><span>Worst IMD5</span><strong data-imd5>−61.7 <small>dBc</small></strong></div></div>
        <table class="ip-table"><thead><tr><th>Product</th><th>dBm</th><th>dBc</th><th>MHz</th></tr></thead><tbody data-table></tbody></table>
        <div class="ip-reference"><span>Reference</span><strong>Single tone</strong><small>Equal fundamentals in this study</small></div>
        <div class="ip-reference"><span>Tone separation</span><strong>1.200 kHz</strong><small>Measured spectrum positions</small></div>
        <div class="ip-keys"><span><b class="ip-tone">○</b> Fundamentals</span><span><b class="ip-third">◇</b> Third order</span><span><b class="ip-fifth">□</b> Fifth order</span><span class="ip-muted">Hollow / dashed: expected, unmeasured</span></div>
      </aside>
    </div>
    <details class="ip-expanded"><summary class="cursor-interaction">All six peaks · levels and frequencies</summary><div data-extra-readings></div></details>
    <footer class="ip-footer"><span>Live values come from the spectrum; waterfall shows history.</span><span>Preview only</span></footer>
  </template>
</div>

<script>
(() => {
 const root=document.getElementById('imd-pan-study'),q=(e,s)=>e.querySelector(s),qa=(e,s)=>[...e.querySelectorAll(s)];
 const products=[{name:'IMD5 L',offset:-3000,group:5,corrected:-81.7,uncorrected:-64},{name:'IMD3 L',offset:-1800,group:3,corrected:-68.2,uncorrected:-48},{name:'Tone L',offset:-600,group:1,corrected:-20,uncorrected:-20},{name:'Tone U',offset:600,group:1,corrected:-20,uncorrected:-20},{name:'IMD3 U',offset:1800,group:3,corrected:-69.1,uncorrected:-49.1},{name:'IMD5 U',offset:3000,group:5,corrected:-83.4,uncorrected:-65.4}];
 const windows=[];
 function rf(p){return (14.2013+p.offset/1e6).toFixed(6);}

 qa(root,'[data-layout]').forEach(win=>{
   win.append(q(root,'#ip-template').content.cloneNode(true));
   const state={win,corrected:true,condition:'valid',enabled:true,guides:true,selected:1,guideAlpha:.42};windows.push(state);
   const aside=q(win,'.ip-inspector');const detailCopy=aside.cloneNode(true);detailCopy.className='ip-extra';q(win,'[data-extra-readings]').append(detailCopy);
   qa(win,'[data-ps]').forEach(b=>b.addEventListener('click',()=>{state.corrected=b.dataset.ps==='on';update(state);}));q(win,'[data-state]').addEventListener('change',e=>{state.condition=e.target.value;update(state);});q(win,'[data-enabled]').addEventListener('change',e=>{state.enabled=e.target.checked;update(state);});q(win,'[data-guides]').addEventListener('click',()=>{state.guides=!state.guides;update(state);});qa(win,'[data-product]').forEach(b=>b.addEventListener('click',()=>{state.selected=Number(b.dataset.product);update(state);}));qa(win,'canvas').forEach(canvas=>canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),domain=state.condition==='cropped'?[-2400,2400]:[-4000,4000],freq=domain[0]+(e.clientX-r.left-48)/(r.width-65)*(domain[1]-domain[0]);let nearest=0;products.forEach((p,i)=>{if(Math.abs(p.offset-freq)<Math.abs(products[nearest].offset-freq))nearest=i;});state.selected=nearest;update(state);}));

 });
 function valid(state,p){return state.enabled&&state.condition!=='waiting'&&!(state.condition==='missing'&&p.group===5)&&!(state.condition==='cropped'&&p.group===5);}
 function update(state){const {win}=state,measured=state.enabled&&state.condition==='valid',level=p=>state.corrected?p.corrected:p.uncorrected;qa(win,'[data-ps]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.ps==='on')===state.corrected)));q(win,'[data-guides]').setAttribute('aria-pressed',String(state.guides));qa(win,'[data-product]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.product)===state.selected)));const status=!state.enabled?'Overlay off':state.condition==='valid'?'● Valid peaks':state.condition==='missing'?'IMD5 unmeasured':state.condition==='cropped'?'IMD5 outside view':'Waiting for TX';q(win,'[data-status]').textContent=status;qa(win,'[data-detail-status]').forEach(e=>e.textContent=measured?'Valid':'Incomplete');q(win,'[data-status]').classList.toggle('ip-green',measured);qa(win,'[data-imd3]').forEach(e=>e.innerHTML=(measured?signed(level(products[1])+20):'—')+' <small>dBc</small>');qa(win,'[data-imd5]').forEach(e=>e.innerHTML=(measured?signed(level(products[0])+20):'—')+' <small>dBc</small>');qa(win,'[data-table]').forEach(t=>{t.replaceChildren();products.forEach((p,i)=>{const row=document.createElement('tr');row.classList.toggle('is-selected',i===state.selected);[p.name,valid(state,p)?signed(level(p)):'—',valid(state,p)?signed(level(p)+20):'—',rf(p)].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.append(cell);});t.append(row);});});const p=products[state.selected];q(win,'[data-selected-name]').textContent=p.name;q(win,'[data-selected-freq]').textContent=rf(p)+' MHz';q(win,'[data-selected-level]').textContent=valid(state,p)?signed(level(p))+' dBm · '+signed(level(p)+20)+' dBc':'— dBm · — dBc';q(win,'[data-selected-state]').textContent=valid(state,p)?'Measured peak':'Expected position · unmeasured';const message=q(win,'[data-message]');message.hidden=state.condition==='valid'||!state.enabled;message.textContent=state.condition==='missing'?'IMD5 peaks not found. Expected locations remain dashed; missing levels are blank.':state.condition==='cropped'?'IMD5 lies outside this span. Widen the display to include both fifth-order products.':'Waiting for two-tone transmission. Current values are blank; waterfall history remains visible.';q(win,'.ip-rail').hidden=!state.enabled;q(win,'.ip-product-picker').hidden=!state.enabled;q(win,'.ip-selection').hidden=!state.enabled;qa(win,'[data-guides]').forEach(b=>b.disabled=!state.enabled);draw(state);}
 function draw(state){const {win}=state,styles=getComputedStyle(root),color=n=>styles.getPropertyValue(n).trim(),col=p=>color(p.group===1?'--ip-amber':p.group===3?'--ip-third':'--ip-fifth'),domain=state.condition==='cropped'?[-2400,2400]:[-4000,4000],range=domain[1]-domain[0];
   const canvas=q(win,'[data-spectrum]');if(!canvas.clientWidth)return;const w=canvas.clientWidth,h=canvas.clientHeight,dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);const left=48,right=w-17,top=44,bottom=h-44,x=f=>left+(f-domain[0])/range*(right-left),y=db=>bottom-((db+120)/110)*(bottom-top);c.font='11px -apple-system,sans-serif';c.strokeStyle='#2b2b37';c.fillStyle=color('--ip-muted');c.textAlign='right';[-20,-40,-60,-80,-100,-120].forEach(db=>{c.beginPath();c.moveTo(left,y(db));c.lineTo(right,y(db));c.stroke();c.fillText(String(db),left-8,y(db)+4);});const ticks=w<420?[-3000,0,3000]:[-4000,-2000,0,2000,4000];c.textAlign='center';ticks.filter(f=>f>=domain[0]&&f<=domain[1]).forEach(f=>{c.beginPath();c.moveTo(x(f),top);c.lineTo(x(f),bottom);c.stroke();c.fillText((f/1000).toFixed(1),x(f),bottom+18);});c.fillText('Offset from tone midpoint / kHz',w/2,h-8);
   const level=(f,corrected,condition)=>{let db=-112+1.8*Math.sin(f*.073)+1.4*Math.cos(f*.033);if(condition==='waiting')return db;products.forEach(p=>{if(condition==='missing'&&p.group===5)return;const peak=corrected?p.corrected:p.uncorrected,dist=Math.abs(f-p.offset),v=peak-10*Math.log10(1+Math.pow(dist/11,4));db=Math.max(db,v);});return db;};
   c.save();c.beginPath();c.rect(left,top,right-left,bottom-top);c.clip();const points=[];for(let px=left;px<=right;px++){const f=domain[0]+(px-left)/(right-left)*range;points.push([px,y(level(f,state.corrected,state.condition))]);}c.beginPath();c.moveTo(left,bottom);points.forEach(p=>c.lineTo(...p));c.lineTo(right,bottom);c.closePath();const grad=c.createLinearGradient(0,top,0,bottom);grad.addColorStop(0,'#80a6c628');grad.addColorStop(1,'#80a6c606');c.fillStyle=grad;c.fill();c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.strokeStyle='#c5d3e0';c.lineWidth=1.3;c.stroke();c.restore();
