<div id="ps-explore" aria-label="PureSignal and AmpView window exploration">
  <div class="px-switch"><button type="button" data-surface="pure" aria-pressed="true" class="cursor-interaction">PureSignal</button><button type="button" data-surface="amp" aria-pressed="false" class="cursor-interaction">AmpView</button><span>Interactive design study · synthetic data</span></div>
  <div data-surface-panel="pure" class="viz-carousel viz-dotted-background" aria-label="PureSignal window layouts">
    <section data-variant="Operating view"><div class="px-stage"><div class="px-window px-operating" data-pure aria-label="PureSignal operating view"></div></div></section>
    <section data-variant="Bench view" hidden><div class="px-stage"><div class="px-window px-bench" data-pure aria-label="PureSignal bench view"></div></div></section>
  </div>
  <div data-surface-panel="amp" class="viz-carousel viz-dotted-background" aria-label="AmpView plot layouts" hidden>
    <section data-variant="Linked plots"><div class="px-stage"><div class="px-window" data-amp="linked" aria-label="AmpView linked plots"></div></div></section>
    <section data-variant="Unified plot" hidden><div class="px-stage"><div class="px-window" data-amp="unified" aria-label="AmpView unified plot"></div></div></section>
  </div>
  <template id="px-pure-template">
    <header class="px-title"><span><i data-lucide="radio" aria-hidden="true"></i> PureSignal</span><label><input type="checkbox"> On top</label></header>
    <div class="px-toolbar"><div class="px-actions"><button type="button" data-auto aria-pressed="true" class="cursor-interaction">Auto cal</button><button type="button" data-single class="cursor-interaction">Single cal</button><button type="button" data-tone aria-pressed="true" class="cursor-interaction">Two-tone <i data-lucide="radio-tower" aria-hidden="true"></i></button><button type="button" data-off class="px-off cursor-interaction">OFF</button></div><button type="button" data-open-amp class="px-quiet cursor-interaction">AmpView <i data-lucide="external-link" aria-hidden="true"></i></button></div>
    <div class="px-preview-state"><span>Preview condition</span><select data-condition aria-label="Preview radio condition" class="cursor-interaction"><option value="correcting">Correcting</option><option value="idle">Receive / idle</option><option value="off">PureSignal off</option><option value="low">Feedback too low</option><option value="collecting">Collecting samples</option><option value="disconnected">Disconnected</option></select></div>
    <div class="px-body">
      <aside class="px-persistent">
        <section class="px-feedback"><div class="px-eyebrow">RF FEEDBACK <span class="px-feedback-state px-green">In range</span></div><div class="px-feedback-reading"><span class="px-digits" data-feedback>155</span><span class="px-muted">level / 255</span></div><div class="px-ruler" role="img" aria-label="Feedback scale zero to 255, with an illustrated target range"><div class="px-range"></div><div class="px-meter-fill"></div><span class="px-needle"></span></div><div class="px-ticks"><span>0</span><span>91</span><span>129</span><span>181</span><span>255</span></div><div class="px-feedback-caption"><span>Auto attenuation</span><span class="px-green">Enabled</span></div></section>
        <section class="px-correction"><div class="px-eyebrow">CORRECTION</div><div class="px-status-title"><span class="px-dot"></span><span data-correction>Applied</span></div><p class="px-state-help">New solutions are being calculated.</p><div class="px-cal-progress"><span class="px-green" data-stage="collect">● Collect</span><span>→</span><span class="px-green" data-stage="solve">● Solve</span><span>→</span><span class="px-green" data-stage="apply">● Apply</span></div><div class="px-pair"><span>Correction solutions <small>cor.cnt</small></span><strong data-count>24</strong></div><div class="px-pair"><span>Rejected sample sets <small>dg.cnt</small></span><strong data-reject>0</strong></div></section>
      </aside>
      <div class="px-workarea">
        <div class="px-tabs" role="tablist" aria-label="PureSignal detail sections"><button type="button" role="tab" data-tab="calibration" aria-selected="true" class="cursor-interaction">Calibration</button><button type="button" role="tab" data-tab="measurements" aria-selected="false" class="cursor-interaction">IMD measurements</button><button type="button" role="tab" data-tab="diagnostics" aria-selected="false" class="cursor-interaction">Diagnostics</button></div>
        <section class="px-panel" data-content="calibration">
          <div class="px-section-title">Feedback control</div>
          <div class="px-checks"><label><input type="checkbox" checked data-att> Auto attenuate</label><label><input type="checkbox"> Quick attenuate response</label></div>
          <div class="px-section-title">Timing <span>Existing controls</span></div>
          <div class="px-timing"><label>MOX wait <span><input type="number" min="0.1" max="10" step="0.1" value="2.0" aria-label="MOX wait seconds"> s</span></label><label>CAL wait <span><input type="number" min="0" max="100" step="0.1" value="0.0" aria-label="CAL wait seconds"> s</span></label><label>AMP delay <span><input type="number" min="0" max="25000000" step="20" value="150" aria-label="Amplifier delay nanoseconds"> ns</span></label></div>
          <div class="px-section-title">Solution controls</div>
          <div class="px-solution-controls"><label><input type="checkbox" checked> PIN <small>Pin upper gain curve</small></label><label><input type="checkbox" checked> MAP <small>Remap sample intervals</small></label><label><input type="checkbox"> STBL <small>Average sample collections</small></label><label><input type="checkbox"> Relax tolerance</label><label>TINT <select data-tint aria-label="TINT in decibels"><option>0.5</option><option>1.1</option><option>2.5</option></select> dB</label></div>
          <div class="px-peak-reference"><div><span class="px-section-title">Hardware peak reference</span><div class="px-muted px-small">Measured and expected digital TX feedback</div></div><div class="px-peak-values"><span>GetPk <strong data-getpk>0.6121</strong></span><label>SetPk <input type="text" value="0.6121" aria-label="Expected hardware peak"></label><button type="button" data-default class="px-quiet cursor-interaction">Default</button></div></div>
        </section>
        <section class="px-panel" data-content="measurements" hidden>
          <div class="px-measure-head"><label><input type="checkbox" checked data-show-imd> Show two-tone measurements</label><select data-imd-state aria-label="Preview measurement condition"><option value="valid">Valid peaks</option><option value="waiting">Waiting for two-tone</option><option value="missing">Peaks not found</option><option value="duplex">Duplex required</option></select></div>
          <div class="px-imd-summary"><div><span class="px-eyebrow">WORST IMD3</span><strong data-imd3>−48.2 <small>dBc</small></strong></div><div><span class="px-eyebrow">WORST IMD5</span><strong data-imd5>−61.7 <small>dBc</small></strong></div></div>
          <div class="px-measure-message px-green" data-imd-message aria-live="polite">Valid measurement · synthetic test signal</div>
          <table class="px-results"><thead><tr><th>Product</th><th>Lower / dBm</th><th>Upper / dBm</th></tr></thead><tbody><tr><td>Fundamental</td><td data-measured>−20.0</td><td data-measured>−20.0</td></tr><tr><td>IMD3</td><td data-measured>−68.2</td><td data-measured>−69.1</td></tr><tr><td>IMD5</td><td data-measured>−81.7</td><td data-measured>−83.4</td></tr></tbody></table>
          <div class="px-measure-note">Relative values use the per-tone reference in this study. Final presentation must identify the implemented reference.</div>
          <div class="px-pair"><span>OIP3</span><strong data-measured>+4.1 dBm</strong></div><div class="px-pair"><span>OIP5</span><strong data-measured>−4.6 dBm</strong></div>
        </section>
        <section class="px-panel px-diagnostics" data-content="diagnostics" hidden>
          <div class="px-section-title">Calibration diagnostics <span>Raw WDSP fields</span></div>
          <div class="px-diag-grid"><div><span>Feedback curve <small>bldr.rx</small></span><strong>0</strong></div><div><span>Magnitude correction <small>bldr.cm</small></span><strong>0</strong></div><div><span>Cosine correction <small>bldr.cc</small></span><strong>0</strong></div><div><span>Sine correction <small>bldr.cs</small></span><strong>0</strong></div><div><span>Solution check <small>sln.chk</small></span><strong>0</strong></div><div><span>State code <small>state</small></span><strong>—</strong></div><div><span>RF feedback <small>feedbk</small></span><strong data-feedback>155</strong></div><div><span>Correction count <small>cor.cnt</small></span><strong data-count>24</strong></div><div><span>Rejected sets <small>dg.cnt</small></span><strong data-reject>0</strong></div></div>
          <label class="px-spectrum-toggle"><input type="checkbox"> Display PS-RX and PS-TX spectra</label>
        </section>
      </div>
    </div>
    <footer class="px-footer"><div class="px-actions"><button type="button" data-save class="cursor-interaction"><i data-lucide="save" aria-hidden="true"></i> Save</button><button type="button" data-restore class="cursor-interaction">Restore…</button></div><span data-file-state>Correction files available</span><span class="px-preview-label">Preview only</span></footer>
  </template>
  <template id="px-amp-template">
    <header class="px-title"><span><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i> AmpView</span><label><input type="checkbox"> On top</label></header>
    <div class="px-amp-top"><div><span class="px-eyebrow">AMPLIFIER TRANSFER</span><h2>Response &amp; correction</h2></div><span class="px-green px-small" data-amp-status>● Sample curves</span></div>
    <div class="px-amp-toolbar"><div class="px-actions"><button type="button" data-gain aria-pressed="false" class="cursor-interaction">Show gain</button><button type="button" data-zoom aria-pressed="false" class="cursor-interaction">Phase zoom</button><button type="button" data-lowres aria-pressed="false" class="cursor-interaction">Low res</button></div><select data-data-state aria-label="Preview curve availability"><option value="valid">Available curves</option><option value="held">Retained curves / RX</option><option value="empty">No calibration data</option></select></div>
    <div class="px-legend" aria-label="Visible curve series"><button type="button" data-series="magAmp" aria-pressed="true" class="cursor-interaction"><span class="px-swatch px-dot-swatch" style="color:#80a6c6">●</span> Amp magnitude</button><button type="button" data-series="magCorr" aria-pressed="true" class="cursor-interaction"><span class="px-swatch" style="color:#d8a55f">━</span> Mag correction</button><button type="button" data-series="phsAmp" aria-pressed="true" class="cursor-interaction"><span class="px-swatch" style="color:#bf9cb8">◆</span> Amp phase</button><button type="button" data-series="phsCorr" aria-pressed="true" class="cursor-interaction"><span class="px-swatch" style="color:#83b497">━</span> Phase correction</button><button type="button" data-series="ref" aria-pressed="true" class="cursor-interaction"><span class="px-swatch">┄</span> Reference</button></div>
    <div class="px-chart-stack"><div class="px-chart-block" data-kind="mag"><div class="px-chart-label"><span data-mag-label>Magnitude</span><span class="px-muted">Normalized</span></div><canvas data-chart="mag" role="img" aria-label="Synthetic amplifier and correction magnitude versus input magnitude"></canvas></div><div class="px-chart-block" data-kind="phase"><div class="px-chart-label"><span>Phase</span><span class="px-muted">Degrees</span></div><canvas data-chart="phase" role="img" aria-label="Synthetic amplifier and correction phase versus input magnitude"></canvas></div><div class="px-chart-block" data-kind="unified"><div class="px-chart-label"><span data-mag-label>Magnitude</span><span class="px-muted">Phase / degrees · right axis</span></div><canvas data-chart="unified" role="img" aria-label="Five synthetic AmpView series on a shared input axis, magnitude left and phase right"></canvas></div></div>
    <div class="px-cursor-readout" aria-live="polite"><div><span>Input magnitude</span><strong data-cursor-x>0.600</strong></div><div><span data-amp-mag-label>Amp magnitude</span><strong data-cursor-magamp>0.561</strong></div><div><span data-corr-mag-label>Mag correction</span><strong data-cursor-magcorr>0.649</strong></div><div><span>Amp phase</span><strong data-cursor-phsamp>3.24°</strong></div><div><span>Phase correction</span><strong data-cursor-phscorr>−3.24°</strong></div></div>
    <footer class="px-footer"><span>Points: amplifier samples · lines: correction functions</span><span class="px-preview-label">Synthetic curves</span></footer>
  </template>
</div>
<style>
#ps-explore{color-scheme:dark;--px-bg:#0b0b0e;--px-panel:#131317;--px-line:#303037;--px-text:#dedee4;--px-muted:#a6a6b1;--px-amber:#d8a55f;--px-blue:#80a6c6;--px-green:#83b497;--px-red:#db8a81;font:12px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--px-text)}
#ps-explore *{box-sizing:border-box}
#ps-explore [hidden]{display:none!important}
#ps-explore .px-switch{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 92px 14px 0}
#ps-explore .px-switch>span{color:var(--px-muted);font-size:11px;margin-left:8px}

#ps-explore button,#ps-explore select,#ps-explore input{font:inherit;color:var(--px-text)}
#ps-explore button{min-height:30px;border:1px solid var(--px-line);border-radius:5px;padding:5px 9px;background:linear-gradient(#24242b,#19191f);display:inline-flex;justify-content:center;align-items:center;gap:6px}
#ps-explore button:hover{border-color:#72727e}
#ps-explore button[aria-pressed=true],#ps-explore .px-tabs button[aria-selected=true]{background:linear-gradient(#2c4a69,#20364e);border-color:#50769b}
#ps-explore button:disabled{opacity:.4}
#ps-explore .px-quiet{background:transparent;border-color:transparent}
#ps-explore .px-off{color:var(--px-red)}
#ps-explore select,#ps-explore input[type=number],#ps-explore input[type=text]{background:#1a1a20;border:1px solid #3b3b45;border-radius:4px;padding:5px 7px;min-height:29px;max-width:100%}
#ps-explore input[type=number]{width:84px;text-align:right;font-family:'SFMono-Regular',Consolas,monospace;color:var(--px-amber)}
#ps-explore input[type=text]{width:82px;text-align:right;font-family:'SFMono-Regular',Consolas,monospace;color:var(--px-amber)}
#ps-explore input[type=checkbox]{accent-color:#527da4;flex-shrink:0}
#ps-explore label{display:flex;align-items:center;gap:7px}
#ps-explore .px-title{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 15px;background:linear-gradient(#232329,#1a1a1f);border-bottom:1px solid #08080b;color:var(--px-muted);font-size:12px}

#ps-explore i,#ps-explore button svg,#ps-explore .px-title svg{width:14px;height:14px;flex-shrink:0}
#ps-explore .px-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#ps-explore .px-toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--px-panel);padding:12px 15px;border-bottom:1px solid var(--px-line)}
#ps-explore .px-preview-state{display:flex;justify-content:flex-end;align-items:center;gap:9px;color:var(--px-muted);padding:10px 15px 0;font-size:11px}

#ps-explore .px-body{padding:18px 18px 0}

#ps-explore .px-green{color:var(--px-green);letter-spacing:0}
#ps-explore .px-red{color:var(--px-red)}

#ps-explore .px-tabs{display:flex;gap:5px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--px-line);border-bottom:1px solid var(--px-line)}
