&lt;style&gt;
#ps-explore{color-scheme:dark;--px-bg:#0b0b0e;--px-panel:#131317;--px-line:#303037;--px-text:#dedee4;--px-muted:#a6a6b1;--px-amber:#d8a55f;--px-blue:#80a6c6;--px-green:#83b497;--px-red:#db8a81;font:12px/1.45 -apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif;color:var(--px-text)}
#ps-explore *{box-sizing:border-box}
#ps-explore [hidden]{display:none!important}
#ps-explore .px-switch{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 92px 14px 0}
#ps-explore .px-switch&gt;span{color:var(--px-muted);font-size:11px;margin-left:8px}
#ps-explore .px-stage{min-height:845px;padding:14px 0 20px}
#ps-explore .px-window{background:var(--px-bg);border:1px solid #3b3b43;border-radius:9px;overflow:hidden;width:100%;box-shadow:0 12px 35px #0004}
#ps-explore button,#ps-explore select,#ps-explore input{font:inherit;color:var(--px-text)}
#ps-explore button{min-height:30px;border:1px solid var(--px-line);border-radius:5px;padding:5px 9px;background:linear-gradient(#24242b,#19191f);display:inline-flex;justify-content:center;align-items:center;gap:6px}
#ps-explore button:hover{border-color:#72727e}
#ps-explore button[aria-pressed=true],#ps-explore .px-tabs button[aria-selected=true]{background:linear-gradient(#2c4a69,#20364e);border-color:#50769b}
#ps-explore button:disabled{opacity:.4}
#ps-explore .px-quiet{background:transparent;border-color:transparent}
#ps-explore .px-off{color:var(--px-red)}
#ps-explore select,#ps-explore input[type=number],#ps-explore input[type=text]{background:#1a1a20;border:1px solid #3b3b45;border-radius:4px;padding:5px 7px;min-height:29px;max-width:100%}
#ps-explore input[type=number]{width:84px;text-align:right;font-family:&#x27;SFMono-Regular&#x27;,Consolas,monospace;color:var(--px-amber)}
#ps-explore input[type=text]{width:82px;text-align:right;font-family:&#x27;SFMono-Regular&#x27;,Consolas,monospace;color:var(--px-amber)}
#ps-explore input[type=checkbox]{accent-color:#527da4;flex-shrink:0}
#ps-explore label{display:flex;align-items:center;gap:7px}
#ps-explore .px-title{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 15px;background:linear-gradient(#232329,#1a1a1f);border-bottom:1px solid #08080b;color:var(--px-muted);font-size:12px}
#ps-explore .px-title&gt;span{display:flex;align-items:center;gap:9px;color:var(--px-text)}
#ps-explore i,#ps-explore button svg,#ps-explore .px-title svg{width:14px;height:14px;flex-shrink:0}
#ps-explore .px-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#ps-explore .px-toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--px-panel);padding:12px 15px;border-bottom:1px solid var(--px-line)}
#ps-explore .px-preview-state{display:flex;justify-content:flex-end;align-items:center;gap:9px;color:var(--px-muted);padding:10px 15px 0;font-size:11px}
#ps-explore .px-preview-state select{font-size:11px}
#ps-explore .px-body{padding:18px 18px 0}
#ps-explore .px-persistent{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;padding-bottom:20px}
#ps-explore .px-eyebrow{font-size:11px;letter-spacing:1.25px;color:var(--px-muted);display:flex;align-items:center;justify-content:space-between;gap:12px}
#ps-explore .px-green{color:var(--px-green);letter-spacing:0}
#ps-explore .px-red{color:var(--px-red)}
#ps-explore .px-muted{color:var(--px-muted)}
#ps-explore .px-small{font-size:11px}
#ps-explore .px-feedback-reading{display:flex;gap:13px;align-items:baseline;margin:8px 0 15px}

#ps-explore .px-range{position:absolute;left:50.6%;width:20.4%;top:0;bottom:0;background:#2e4c3b}

#ps-explore .px-ticks span{position:absolute;transform:translateX(-50%)}
#ps-explore .px-ticks span:nth-child(1){left:0;transform:none}
#ps-explore .px-ticks span:nth-child(2){left:35.7%}
#ps-explore .px-ticks span:nth-child(3){left:50.6%}
#ps-explore .px-ticks span:nth-child(4){left:71%}

#ps-explore .px-feedback-caption{display:flex;justify-content:space-between;gap:10px;margin-top:15px;color:var(--px-muted);font-size:11px}
#ps-explore .px-correction{border-left:1px solid var(--px-line);padding-left:24px}

#ps-explore .px-cal-progress{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--px-muted);margin:8px 0 12px}
#ps-explore .px-pair{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0;color:var(--px-muted)}
#ps-explore strong{font-family:&#x27;SFMono-Regular&#x27;,Consolas,monospace;font-weight:400;font-variant-numeric:tabular-nums;color:var(--px-amber)}
#ps-explore small{font-size:11px;color:var(--px-muted)}
#ps-explore .px-pair small{margin-left:5px;color:#888893}
#ps-explore .px-tabs{display:flex;gap:5px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--px-line);border-bottom:1px solid var(--px-line)}
#ps-explore .px-tabs button{background:transparent;border-color:transparent}
#ps-explore .px-panel{padding:17px 0;min-height:360px}
#ps-explore .px-section-title{font-size:12px;color:var(--px-text);display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 11px}
#ps-explore .px-section-title&gt;span{font-size:11px;color:var(--px-muted)}
#ps-explore .px-checks{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;color:var(--px-muted)}
#ps-explore .px-timing{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;padding-bottom:20px}
#ps-explore .px-timing&gt;label{display:flex;flex-direction:column;align-items:flex-start;gap:6px;color:var(--px-muted)}
#ps-explore .px-timing span{display:flex;align-items:center;gap:6px}
#ps-explore .px-solution-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 15px;margin-bottom:18px}
#ps-explore .px-solution-controls&gt;label{flex-wrap:wrap;color:var(--px-text)}
#ps-explore .px-solution-controls small{flex-basis:100%;padding-left:23px}
#ps-explore .px-peak-reference{border-top:1px solid var(--px-line);padding:15px 0 0;display:flex;gap:15px;justify-content:space-between;align-items:center;flex-wrap:wrap}
#ps-explore .px-peak-reference .px-section-title{margin:0 0 4px}
#ps-explore .px-peak-values{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#ps-explore .px-peak-values&gt;span{display:flex;gap:9px;align-items:center}
#ps-explore .px-diag-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 20px}
#ps-explore .px-diag-grid&gt;div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #26262e}
#ps-explore .px-diag-grid small{display:block}
#ps-explore .px-spectrum-toggle{margin-top:22px;color:var(--px-muted)}
#ps-explore .px-footer{border-top:1px solid var(--px-line);padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--px-panel);font-size:11px;color:var(--px-muted)}
#ps-explore .px-preview-label{margin-left:auto;color:#90909d}
#ps-explore .px-measure-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;color:var(--px-muted)}
#ps-explore .px-measure-head select{font-size:11px}
#ps-explore .px-imd-summary{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:20px 0 12px}
#ps-explore .px-imd-summary strong{font-size:30px;display:block;margin-top:6px}
#ps-explore .px-imd-summary small{font:12px -apple-system,sans-serif}
#ps-explore .px-measure-message{font-size:11px;margin-bottom:16px}
#ps-explore .px-results{width:100%;border-collapse:collapse;font-size:12px}

#ps-explore .px-results td:first-child,#ps-explore .px-results th:first-child{text-align:left;font-family:inherit;color:var(--px-muted)}
#ps-explore .px-measure-note{color:var(--px-muted);font-size:11px;margin:14px 0}
#ps-explore .px-bench .px-body{display:grid;grid-template-columns:205px minmax(0,1fr);gap:20px}
#ps-explore .px-bench .px-persistent{display:flex;flex-direction:column;gap:23px;padding-right:18px;border-right:1px solid var(--px-line)}
#ps-explore .px-bench .px-correction{padding:18px 0 0;border-left:0;border-top:1px solid var(--px-line)}
#ps-explore .px-bench .px-status-title{font-size:24px}
#ps-explore .px-bench .px-tabs{border-top:0;padding-top:0}
#ps-explore .px-bench .px-tabs button[data-tab=diagnostics]{display:none}
#ps-explore .px-bench .px-timing{gap:8px}
#ps-explore .px-bench .px-solution-controls{grid-template-columns:1fr 1fr}
#ps-explore .px-bench .px-panel{min-height:390px}
#ps-explore .px-bench .px-diagnostic-dock{border-top:1px solid var(--px-line);padding:15px 18px}
#ps-explore .px-bench .px-diagnostic-dock .px-panel{padding:0;min-height:0}
#ps-explore .px-bench .px-diag-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
#ps-explore .px-bench .px-spectrum-toggle{margin-top:12px}
#ps-explore .px-amp-top{padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
#ps-explore h2{font-size:22px;font-weight:500;margin:4px 0 0}
#ps-explore .px-amp-toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:0 18px 14px}
#ps-explore .px-amp-toolbar select{font-size:11px}
#ps-explore .px-legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:12px 18px;border-top:1px solid var(--px-line);border-bottom:1px solid var(--px-line)}
#ps-explore .px-legend button{font-size:11px;min-height:25px;background:transparent!important;border:0!important;padding:2px 0;color:var(--px-text)}
#ps-explore .px-legend button[aria-pressed=false]{opacity:.4}
#ps-explore .px-swatch{font-size:17px}
#ps-explore .px-chart-stack{padding:16px 16px 0;background:#0d0d11}
#ps-explore .px-chart-label{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:0 3px 4px}
#ps-explore canvas{display:block;width:100%;height:208px}
#ps-explore .px-chart-block{margin-bottom:12px}
#ps-explore [data-amp=linked] [data-kind=unified],#ps-explore [data-amp=unified] [data-kind=mag],#ps-explore [data-amp=unified] [data-kind=phase]{display:none}
#ps-explore [data-amp=unified] canvas{height:466px}
#ps-explore .px-cursor-readout{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:16px 18px;border-top:1px solid var(--px-line);background:var(--px-panel)}
#ps-explore .px-cursor-readout&gt;div{display:flex;flex-direction:column;gap:7px;min-width:0}
#ps-explore .px-cursor-readout span{font-size:11px;color:var(--px-muted)}

      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
