# Network receive buffer limit for the NereusSDR Core (nereusd).
# Installed as /usr/lib/sysctl.d/10-nereusd.conf and read at every system
# start. The Core's installers also apply it at install, only ever upward
# (raise-receive-buffer-limit).
#
# The Core asks for a 4 MB receive buffer on the socket its radio sends to
# (4194304 bytes: kRadioSocketReceiveBufferBytes in src/core/RadioConnection.h,
# asked for in P1RadioConnection.cpp and P2RadioConnection.cpp,
# applySocketBufferSizes). Linux grants a program at most net.core.rmem_max.
# On the Radxa Rock 5C as found that was 212992 bytes, a twentieth of what
# the Core asks for, which holds 6 to 9 ms of the radio's packets with three
# or four wide receivers open. Whenever the Core's network thread was held up
# for longer than that, the kernel dropped packets and the receivers lost
# samples (measured 2026-10-10).
#
# This raises the limit to exactly what the Core asks for and sets nothing
# else. It is a ceiling on what a program may ask for, not a size any socket
# is given: a program that does not ask keeps the system's default size.
#
# Where two sysctl.d files set the same limit, the one whose name sorts later
# wins (sysctl.d(5)). This name sorts ahead of an administrator's own files
# (60 to 90 by systemd's convention), so a later file that sets this limit
# wins over this one, whether its value is higher or lower. To keep the
# system's own limit with the package installed, link
# /etc/sysctl.d/10-nereusd.conf to /dev/null (sysctl.d(5)).
#
# To undo it: remove the nereusd package, or delete this file. The system
# then starts with its own limit again. To put the old limit back at once:
#   sysctl -w net.core.rmem_max=212992
net.core.rmem_max = 4194304
