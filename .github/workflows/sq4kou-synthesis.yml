name: SQ4KOU upstream synthesis

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sq4kou-synthesis.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  merge:
    if: github.head_ref == 'synthesis/upstream-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Three-way synthesis preserving SQ4KOU source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "SQ4KOU synthesis"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH='synthesis/upstream-20261017'
          BASE='50ff60e089087cec12f40150703c01a61fdd3f03'
          USER_BASE='f108febada81dcdd3079ce735d88d1b9c195e356'
          UPSTREAM='a0b381e79cbfc289eb9c663b64274d066a82ad7e'

          echo '::group::Checkout original SQ4KOU sources'
          git fetch --no-tags origin "$BRANCH" main
          git checkout -B "$BRANCH" "origin/$BRANCH"
          USER_TIP="$(git rev-parse HEAD)"
          export BASE USER_TIP
          git remote add upstream https://github.com/boydsoftprez/NereusSDR.git
          echo 'Fetching verified upstream main, full ancestry'
          git fetch --no-tags upstream main
          git cat-file -e "$UPSTREAM^{commit}"
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$USER_BASE^{commit}"
          test "$(git rev-parse "$BASE^{tree}")" = "$(git rev-parse "$USER_BASE^{tree}")"
          echo "BASE_TREE_PASS: $(git rev-parse "$BASE^{tree}")"
          echo "USER_TIP: $USER_TIP"
          echo "UPSTREAM: $UPSTREAM"
          echo '::endgroup::'

          echo '::group::Create true three-way ancestry bridge'
          BRIDGE="$(printf 'Bridge independently imported SQ4KOU history to identical upstream tree\n' | git commit-tree "$(git rev-parse "$USER_TIP^{tree}")" -p "$USER_TIP" -p "$BASE")"
          git reset --hard "$BRIDGE"
          echo "BRIDGE: $BRIDGE"
          echo '::endgroup::'

          echo '::group::Three-way merge (SQ4KOU wins conflicting hunks)'
          if git merge --no-commit --no-ff -X ours "$UPSTREAM"; then
            echo "GIT_MERGE: no unresolved conflicts"
          else
            echo "::error::Unresolved structural/binary merge conflicts"
            git status --short
            git ls-files -u
            exit 1
          fi
          echo '::endgroup::'

          echo '::group::Check ALL original SQ4KOU code additions are retained'
          python3 - <<'PY'
          import collections, os, pathlib, subprocess, sys
          base, user = os.environ['BASE'], os.environ['USER_TIP']
          paths = subprocess.check_output(['git','diff','--name-only','-z',base,user]).decode().split('\0')
          missing = []
          checked = 0
          nums = subprocess.check_output(['git','diff','--numstat','-z',base,user]).split(bytes([0]))
          binary = set()
          for rec in nums:
              bits = rec.split(bytes([9]), 2)
              if len(bits) == 3 and bits[0] == bits[1] == b'-':
                  binary.add(bits[2].decode('utf-8', errors='replace'))
          for p in filter(None, paths):
              if p in binary:
                  try:
                      current_sha = subprocess.check_output(['git','hash-object',p]).decode().strip()
                      original_sha = subprocess.check_output(['git','rev-parse',user+':'+p]).decode().strip()
                      if current_sha != original_sha:
                          missing.append((p, 'binary blob differs', 1))
                  except subprocess.CalledProcessError:
                      missing.append((p, 'binary blob absent', 1))
                  continue
              diff = subprocess.check_output(['git','diff','--no-ext-diff','--unified=0',base,user,'--',p]).decode('utf-8', errors='replace')
              additions = collections.Counter(line[1:] for line in diff.splitlines()
                          if line.startswith('+') and not line.startswith('+++') and line[1:].strip())
              if not additions:
                  continue
              checked += 1
              target = pathlib.Path(p)
              if not target.is_file():
                  missing.append((p, 'file absent', 0))
                  continue
              current = collections.Counter(target.read_text(encoding='utf-8', errors='replace').splitlines())
              lost = sum(max(0, count-current.get(line,0)) for line,count in additions.items())
              if lost:
                  missing.append((p, 'patch lines missing', lost))
          print('SQ4KOU_PATCH_FILES_CHECKED:', checked, flush=True)
          if missing:
              print('SQ4KOU_PATCH_LOSS_DETECTED:', len(missing), flush=True)
              for item in missing:
                  print('PATCH_LOSS:', *item, flush=True)
              sys.exit(3)
          print('SQ4KOU_PATCH_ADDITIONS_PRESERVED: PASS', flush=True)
          PY

          for f in src/core/audio/CmAsioBus.cpp src/core/audio/CmAsioBus.h src/gui/setup/AudioBackendStrip.cpp src/gui/setup/AudioBackendStrip.h src/gui/setup/AudioCmAsioPage.cpp src/gui/setup/AudioCmAsioPage.h src/gui/setup/AudioDevicesPage.cpp src/gui/setup/AudioDevicesPage.h; do
            test "$(git rev-parse "$USER_TIP:$f")" = "$(git hash-object "$f")"
          done
          grep -q SQ4KOU_P1_PS_FEEDBACK_STABILIZER_V1 src/core/PureSignal.cpp
          grep -q SQ4KOU_CMASIO_TX_STAGE2 src/core/AudioEngine.cpp
          echo 'SQ4KOU_UNIQUE_FILES_AND_GUARDS: PASS'
          echo '::endgroup::'

          echo '::group::Publish merge candidate (never touch main)'
          git add -A
          git commit -m "Synthesize upstream 2026-10-17 with SQ4KOU patches preserved" -m "Baseline 50ff60e0; verified identical to f108feba. Three-way merge; SQ4KOU conflict precedence. Candidate requires CI and hardware validation."
          git log -3 --format='%h %s'
          git diff --stat "$USER_TIP" HEAD | tail -60
          echo 'Checking working-tree cleanliness'
          git diff --exit-code
          git diff --cached --exit-code
          git push origin HEAD:refs/heads/"$BRANCH"
          echo '::endgroup::'

          echo '::group::Dispatch full existing CI on merged candidate'
          CODE="$(curl -sS -o /tmp/ci-dispatch.json -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$BRANCH\"}")"
          echo "CI_DISPATCH_HTTP: $CODE"
          cat /tmp/ci-dispatch.json
          test "$CODE" = '204'
          echo '::endgroup::'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
