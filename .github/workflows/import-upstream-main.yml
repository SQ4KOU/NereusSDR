name: One-time upstream main snapshot (SQ4KOU backup-safe)
on:
  push:
    branches: [upstream-import-20261018]
    paths: [.github/workflows/import-upstream-main.yml]
permissions:
  contents: write
jobs:
  import-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Import upstream main source files except workflow definitions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth=1 --no-tags --single-branch --branch main https://github.com/boydsoftprez/NereusSDR.git upstream
          actual="$(git -C upstream rev-parse HEAD)"
          expected="0dccef066ef1ed8f49f342ef97a3ff15bb4b0cbd"
          test "$actual" = "$expected" || { echo "Unexpected upstream version: $actual"; exit 1; }
          echo "Original upstream tree: $(git -C upstream rev-parse HEAD^{tree})"
          git -C upstream checkout --orphan imported-main-snapshot
          rm -rf upstream/.github/workflows
          git -C upstream add -A
          test -z "$(git -C upstream ls-files '.github/workflows/*')" || { echo "Workflow exclusion failed"; exit 1; }
          git -C upstream -c user.name='GitHub Actions' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Import boydsoftprez/NereusSDR main $expected (workflows restored separately)"
          echo "Files copied (non-workflow): $(git -C upstream ls-files | wc -l)"
          git -C upstream -c credential.helper= push "https://x-access-token:${GH_TOKEN}@github.com/SQ4KOU/NereusSDR.git" HEAD:refs/heads/upstream-main-20261018
          echo "Snapshot imported. Workflow files to be restored through connector."
