name: SQ4KOU MSI test package

on:
  push:
    branches: [SQ4KOU-work]

permissions:
  actions: read
  contents: read

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for source Windows build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 37343324964 --repo SQ4KOU/NereusSDR --exit-status

      - name: Download source Windows artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path source-artifact | Out-Null
          gh run download 37343324964 --repo SQ4KOU/NereusSDR --name windows-x64 --dir source-artifact
          Get-ChildItem source-artifact -Recurse

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $wix) { throw "WiX Toolset installation not found" }
          $bin = Join-Path $wix.FullName "bin"
          echo "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Get-ChildItem $bin

      - name: Prepare portable tree
        shell: pwsh
        run: |
          $zip = Get-ChildItem source-artifact -Filter "NereusSDR-*-Windows-x64-portable.zip" -Recurse | Select-Object -First 1
          if (-not $zip) { throw "Portable ZIP not found in source artifact" }
          New-Item -ItemType Directory -Force -Path deploy | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath deploy
          if (-not (Test-Path "deploy\NereusSDR.exe")) { throw "NereusSDR.exe missing from portable package" }
          Get-ChildItem deploy | Select-Object Name,Length

      - name: Generate WiX source
        shell: pwsh
        run: |
          @'
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="NereusSDR SQ4KOU TEST" Language="1045"
                     Version="0.5.2.0" Manufacturer="SQ4KOU"
                     UpgradeCode="E63F5B10-94F6-4C0B-AE5A-96F72DE52A31">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine"
                       Platform="x64" Description="NereusSDR SQ4KOU test build"/>
              <MediaTemplate EmbedCab="yes"/>
              <MajorUpgrade DowngradeErrorMessage="A newer test version is already installed."/>
              <Property Id="ARPPRODUCTICON" Value="NereusSDR.exe"/>
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFiles64Folder">
                  <Directory Id="INSTALLFOLDER" Name="NereusSDR SQ4KOU TEST"/>
                </Directory>
                <Directory Id="ProgramMenuFolder">
                  <Directory Id="ApplicationProgramsFolder" Name="NereusSDR SQ4KOU TEST"/>
                </Directory>
              </Directory>
              <DirectoryRef Id="ApplicationProgramsFolder">
                <Component Id="ApplicationShortcut" Guid="B0D555F0-398E-4992-A006-36A30F5B66A1">
                  <Shortcut Id="ApplicationStartMenuShortcut"
                            Name="NereusSDR SQ4KOU TEST"
                            Description="NereusSDR test build"
                            Target="[INSTALLFOLDER]NereusSDR.exe"
                            WorkingDirectory="INSTALLFOLDER"/>
                  <RemoveFolder Id="ApplicationProgramsFolder" On="uninstall"/>
                  <RegistryValue Root="HKLM" Key="Software\SQ4KOU\NereusSDR-Test"
                                 Name="installed" Type="integer" Value="1" KeyPath="yes"/>
                </Component>
              </DirectoryRef>
              <Feature Id="MainFeature" Title="NereusSDR SQ4KOU TEST" Level="1">
                <ComponentGroupRef Id="AppFiles"/>
                <ComponentRef Id="ApplicationShortcut"/>
              </Feature>
            </Product>
          </Wix>
          '@ | Set-Content -Encoding UTF8 Product.wxs

      - name: Harvest files and build MSI
        shell: pwsh
        run: |
          heat.exe dir deploy -nologo -gg -sfrag -srd -sreg -dr INSTALLFOLDER -cg AppFiles -var var.DeployDir -out Harvest.wxs
          candle.exe -nologo -arch x64 -dDeployDir="$((Resolve-Path deploy).Path)" Product.wxs Harvest.wxs
          light.exe -nologo -ext WixUIExtension -out "NereusSDR-0.5.2-test-SQ4KOU-Windows-x64.msi" Product.wixobj Harvest.wixobj
          if (-not (Test-Path "NereusSDR-0.5.2-test-SQ4KOU-Windows-x64.msi")) { throw "MSI was not produced" }
          Get-FileHash "NereusSDR-0.5.2-test-SQ4KOU-Windows-x64.msi" -Algorithm SHA256
          Get-Item "NereusSDR-0.5.2-test-SQ4KOU-Windows-x64.msi"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: NereusSDR-SQ4KOU-test-MSI
          path: NereusSDR-0.5.2-test-SQ4KOU-Windows-x64.msi
          retention-days: 7
          if-no-files-found: error
