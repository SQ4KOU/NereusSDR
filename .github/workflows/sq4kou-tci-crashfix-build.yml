name: SQ4KOU Windows TCI crash-fix build

on:
  push:
    branches: [SQ4KOU-work]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=0.5.2-test" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          # Qt 6.8+ folds qtsvg into qtbase; not listable as a separate module.
          modules: 'qtmultimedia qtserialport qtwebsockets qtshadertools'
          cache: true

      - name: Install Ninja and NSIS
        run: |
          choco install ninja -y
          choco install nsis -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up DeepFilterNet3 library
        shell: pwsh
        run: pwsh -File setup-deepfilter.ps1

      # sccache intentionally not used on Windows — see ci.yml for the
      # explanation. Qt is already cached via install-qt-action.

      - name: Setup FFTW3
        shell: pwsh
        run: |
          $fftw_dir = "third_party/fftw3"
          New-Item -ItemType Directory -Force -Path "$fftw_dir/include", "$fftw_dir/lib", "$fftw_dir/bin"
          Invoke-WebRequest -Uri "https://fftw.org/pub/fftw/fftw-3.3.5-dll64.zip" -OutFile fftw.zip
          Expand-Archive -Path fftw.zip -DestinationPath fftw-tmp
          Copy-Item fftw-tmp/fftw3.h "$fftw_dir/include/"
          Copy-Item fftw-tmp/libfftw3-3.dll "$fftw_dir/bin/"
          cd fftw-tmp
          lib /def:libfftw3-3.def /out:fftw3.lib /machine:x64
          cd ..
          Copy-Item fftw-tmp/fftw3.lib "$fftw_dir/lib/"

      - name: Configure
        shell: bash
        run: |
          # -DNEREUS_GPU_SPECTRUM=ON is explicit so CMake's FATAL_ERROR
          # fires at configure time if the Qt install is missing the
          # ShaderTools or Gui private modules. v0.1.1 silently shipped
          # without GPU spectrum because this flag was implicit; never
          # again.
          #
          # vcpkg (Remote Daemon R2, Task 17 fix round 1, coordinator
          # decision): windows-latest ships vcpkg with
          # VCPKG_INSTALLATION_ROOT already set, so no separate install
          # step is needed. The toolchain file below triggers vcpkg's
          # manifest-mode install (reads vcpkg.json at the repo root) as
          # part of THIS SAME configure run, before find_package(OpenSSL)
          # in CMakeLists.txt executes, installing into
          # build/vcpkg_installed/x64-windows-static-md. -static-md:
          # static OpenSSL libraries against the dynamic CRT, matching
          # what Qt itself links against here, and avoiding a runtime DLL
          # to deploy (this project has already shipped a release broken
          # by a missing runtime DLL: v0.5.0's Windows installer without
          # rade.dll). vcpkg.json's builtin-baseline is pinned to a real
          # vcpkg commit (fix round 2, coordinator-supplied: the commit
          # vcpkg's annotated release tag 2026.07.29 dereferences to) --
          # see that file's own note and the CMakeLists.txt
          # find_package(OpenSSL) block for the full reasoning and how to
          # bump it when taking a future OpenSSL update. Fix round 4:
          # this comment previously (correctly, at the time) called that
          # baseline a placeholder still needing a real SHA; stale after
          # round 2 landed one, corrected here.
          #
          # OPENSSL_ROOT_DIR is passed explicitly, pointing at that same
          # vcpkg install location, as a defensive belt-and-suspenders
          # measure: windows-latest preinstalls Strawberry Perl, which
          # bundles its own MinGW-built OpenSSL that is NOT link-
          # compatible with this MSVC build. Naming the root rather than
          # trusting the toolchain file's search order to win on its own
          # is the point; the CMakeLists.txt find_package(OpenSSL) block
          # asserts the resolved OPENSSL_INCLUDE_DIR is actually under
          # this root and fails the configure loudly if not, rather than
          # linking the wrong copy silently.
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DNEREUS_GPU_SPECTRUM=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md \
            -DOPENSSL_ROOT_DIR="$(pwd)/build/vcpkg_installed/x64-windows-static-md"

      - name: Build
        id: windows_build
        shell: bash
        run: cmake --build build -j${NUMBER_OF_PROCESSORS}

      - name: Record Windows export counts
        if: ${{ always() && (steps.windows_build.outcome == 'success' || steps.windows_build.outcome == 'failure') }}
        shell: pwsh
        run: |
          foreach ($target in @('NereusCore', 'NereusSDRLib')) {
            $definition = "build/CMakeFiles/$target.dir/exports.def"
            if (Test-Path $definition) {
              $exports = @(Get-Content $definition | Where-Object { $_.Trim() -and $_.Trim() -ne 'EXPORTS' })
              $dataExports = @($exports | Where-Object { $_ -match '\sDATA\s*$' })
              Write-Output "Windows exports ${target}: $($exports.Count) total; $($dataExports.Count) DATA"
              Get-FileHash -Algorithm SHA256 $definition | Format-List
            }
          }

      # Keep failed-link evidence on the runner before it is discarded. This
      # does not change the build result or the signed release asset inventory.
      - name: Record failed Windows link diagnostics
        if: ${{ failure() && steps.windows_build.outcome == 'failure' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-link-diagnostics | Out-Null
          Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_(BUILD_TYPE|CXX_COMPILER|MSVC_RUNTIME_LIBRARY|CXX_FLAGS|C_FLAGS)' |
            ForEach-Object { $_.Line } |
            Set-Content windows-link-diagnostics/cmake-flags.txt
          Get-ChildItem build/CMakeFiles/nereus_library_pch.dir -Recurse -Filter cmake_pch.cxx.obj |
            ForEach-Object {
              & dumpbin /symbols $_.FullName > windows-link-diagnostics/pch-symbols.txt
              & dumpbin /directives $_.FullName > windows-link-diagnostics/pch-directives.txt
            }
          if (Test-Path build/NereusCore.lib) {
            & dumpbin /linkermember:1 build/NereusCore.lib > windows-link-diagnostics/core-import-members.txt
          }

      - name: Upload failed Windows link diagnostics
        if: ${{ failure() && steps.windows_build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-link-diagnostics
          path: |
            windows-link-diagnostics/
            build/CMakeFiles/NereusCore.dir/exports.def
            build/CMakeFiles/NereusCore.dir/exports.def.objs
            build/CMakeFiles/NereusCore.rsp
            build/CMakeFiles/NereusSDRLib.dir/exports.def
            build/CMakeFiles/NereusSDRLib.dir/exports.def.objs
            build/CMakeFiles/NereusSDRLib.rsp
            build/CMakeFiles/nereus_library_pch.dir/**/cmake_pch.cxx.obj
            build/compile_commands.json
            build/CMakeFiles/rules.ninja
            build/build.ninja
          retention-days: 7

      - name: Test
        working-directory: build
        shell: bash
        run: ctest --output-on-failure --no-tests=ignore

      - name: Deploy Qt
        shell: pwsh
        run: |
          mkdir deploy
          copy build\NereusSDR.exe deploy\
          windeployqt deploy\NereusSDR.exe --release --no-translations --no-system-d3d-compiler
          if (Test-Path "third_party\fftw3\bin\libfftw3-3.dll") {
            copy third_party\fftw3\bin\libfftw3-3.dll deploy\
          }
          # libfftw3f-3.dll (single-precision) is the one FFTEngine actually
          # imports — committed in-tree at third_party/fftw3/bin/. windeployqt
          # only resolves Qt DLLs, so this non-Qt dependency must be staged
          # by hand or the .exe fails to start on clean installs with
          # "libfftw3f-3.dll was not found" (shipped broken in v0.1.2).
          if (Test-Path "third_party\fftw3\bin\libfftw3f-3.dll") {
            copy third_party\fftw3\bin\libfftw3f-3.dll deploy\
          } else {
            Write-Error "libfftw3f-3.dll missing from third_party\fftw3\bin\ — Windows artifact would ship broken"
            exit 1
          }
          # deepfilter.dll — Rust DFNR runtime (windeployqt only handles Qt DLLs;
          # this non-Qt dependency must be staged by hand or the .exe fails to
          # start with "deepfilter.dll was not found").
          $dfnrDll = "third_party\deepfilter\lib\windows-x86_64\deepfilter.dll"
          if (Test-Path $dfnrDll) {
            Copy-Item $dfnrDll deploy\
          } else {
            Write-Error "deepfilter.dll missing from third_party\deepfilter\lib\windows-x86_64\ — Windows artifact would ship broken (DFNR will crash at load)"
            exit 1
          }
          # rade.dll: librade SHARED library produced by third_party/rade.
          # NereusSDR.exe load-time imports it via __declspec(dllimport),
          # so without rade.dll on the DLL search path the .exe fails to
          # launch with "rade.dll was not found". windeployqt only resolves
          # Qt DLLs, so this non-Qt dep must be staged by hand. v0.5.0
          # shipped without this stanza and the Windows installer was
          # broken; never again.
          $radeDll = "build\third_party\rade\src\rade.dll"
          if (Test-Path $radeDll) {
            Copy-Item $radeDll deploy\
          } else {
            Write-Error "rade.dll missing from build\third_party\rade\src\ (Windows artifact would ship broken: NereusSDR.exe will fail to launch with 'rade.dll was not found')"
            exit 1
          }
          # NereusSDRLib.dll is the application itself, built SHARED so the
          # ~514 test executables stop each embedding a private 22 MB copy.
          # windeployqt resolves only Qt DLLs, so like rade.dll it must be
          # staged by hand. This is the single most load-bearing file in the
          # artifact: without it NereusSDR.exe does not start at all.
          $appDll = "build\NereusSDRLib.dll"
          if (Test-Path $appDll) {
            Copy-Item $appDll deploy\
          } else {
            Write-Error "NereusSDRLib.dll missing from build\ (Windows artifact would ship broken: NereusSDR.exe will fail to launch with 'NereusSDRLib.dll was not found')"
            exit 1
          }
          $coreDll = "build\NereusCore.dll"
          if (Test-Path $coreDll) {
            Copy-Item $coreDll deploy\
          } else {
            Write-Error "NereusCore.dll missing from build\ (Windows artifact would ship broken)"
            exit 1
          }
          # nereus-audio-capture.exe: the microphone capture helper (R-R3-36).
          # NereusSDR.exe looks for it beside itself; without it the PC
          # microphone reports the helper missing. windeployqt runs on
          # NereusSDR.exe only, so it is staged by hand; it loads the Qt and
          # app DLLs NereusSDR.exe already brought into deploy\.
          $helperExe = "build\nereus-audio-capture.exe"
          if (Test-Path $helperExe) {
            Copy-Item $helperExe deploy\
          } else {
            Write-Error "nereus-audio-capture.exe missing from build\ (Windows artifact would ship broken: the PC microphone cannot be opened)"
            exit 1
          }
          $stationExe = "build\nereusd.exe"
          if (-not (Test-Path $stationExe)) {
            Write-Error "nereusd.exe missing from build"
            exit 1
          }
          Copy-Item $stationExe deploy\
          if (-not (Test-Path "deploy\nereusd.exe")) { exit 1 }
          # Copy third-party license notices + both root license files
          # (LICENSE and LICENSE-DUAL-LICENSING) into the portable deploy
          # tree so both the ZIP and the NSIS installer pick them up.
          Copy-Item -Recurse packaging\third-party-licenses deploy\licenses
          Copy-Item LICENSE deploy\licenses\
          Copy-Item LICENSE-DUAL-LICENSING deploy\licenses\
          # DFNR (Apache-2.0 + MIT) and rnnoise (BSD) license files
          New-Item -ItemType Directory -Force -Path deploy\licenses\deepfilter | Out-Null
          Copy-Item third_party\deepfilter\LICENSE        deploy\licenses\deepfilter\
          Copy-Item third_party\deepfilter\LICENSE-APACHE deploy\licenses\deepfilter\
          Copy-Item third_party\deepfilter\LICENSE-MIT    deploy\licenses\deepfilter\
          Copy-Item third_party\deepfilter\COMMIT         deploy\licenses\deepfilter\
          New-Item -ItemType Directory -Force -Path deploy\licenses\rnnoise | Out-Null
          Copy-Item third_party\rnnoise\LICENSE           deploy\licenses\rnnoise\
          # rnnoise models
          New-Item -ItemType Directory -Force -Path deploy\models\rnnoise | Out-Null
          Copy-Item third_party\rnnoise\models\Default_large.bin deploy\models\rnnoise\
          Copy-Item third_party\rnnoise\models\Default_small.bin deploy\models\rnnoise\
          # DeepFilterNet3 ONNX tarball
          New-Item -ItemType Directory -Force -Path deploy\models\dfnet3 | Out-Null
          Copy-Item third_party\deepfilter\models\DeepFilterNet3_onnx.tar.gz deploy\models\dfnet3\

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $name = "NereusSDR-${{ needs.prepare.outputs.version }}-Windows-x64-portable.zip"
          Compress-Archive -Path deploy\* -DestinationPath $name
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $name).Path)
          try {
            if (-not ($archive.Entries | Where-Object { $_.FullName -eq 'nereusd.exe' })) {
              throw 'nereusd.exe missing from portable ZIP'
            }
          } finally { $archive.Dispose() }

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          # Strip any prerelease suffix (e.g. 0.1.0-alpha -> 0.1.0) for VIProductVersion,
          # which NSIS requires to be exactly 4 numeric dot-separated components.
          $versionNumeric = $version -replace '-.*$', ''
          $deploy  = (Resolve-Path deploy).Path
          # NSIS resolves a relative OutFile against the .nsi file's directory,
          # not the invocation CWD. Pass an absolute path so the installer
          # lands in the repo root where the upload-artifact glob finds it.
          $repoRoot = (Resolve-Path .).Path
          $outfile  = Join-Path $repoRoot "NereusSDR-$version-Windows-x64-setup.exe"
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
              /DNSDR_VERSION=$version `
              /DNSDR_VERSION_NUMERIC=$versionNumeric `
              /DNSDR_DEPLOYDIR=$deploy `
              /DNSDR_OUTFILE=$outfile `
              scripts\windows\installer.nsi
          if (-not (Test-Path $outfile)) {
            Write-Error "NSIS did not produce $outfile"
            exit 1
          }
          Get-Item $outfile
          $entries = & "C:\Program Files\7-Zip\7z.exe" l $outfile
          if ($LASTEXITCODE -ne 0 -or -not ($entries | Select-String 'nereusd\.exe')) {
            throw 'nereusd.exe missing from NSIS installer payload'
          }

      - name: Install WiX Toolset for SQ4KOU test MSI
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $wix) { throw "WiX Toolset installation not found" }
          $bin = Join-Path $wix.FullName "bin"
          echo "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Generate SQ4KOU WiX source
        shell: pwsh
        run: |
          @'
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="NereusSDR SQ4KOU TEST" Language="1045"
                     Version="0.5.2.1" Manufacturer="SQ4KOU"
                     UpgradeCode="E63F5B10-94F6-4C0B-AE5A-96F72DE52A31">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine"
                       Platform="x64" Description="NereusSDR SQ4KOU test build"/>
              <MediaTemplate EmbedCab="yes"/>
              <MajorUpgrade DowngradeErrorMessage="A newer test version is already installed."/>
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFiles64Folder">
                  <Directory Id="INSTALLFOLDER" Name="NereusSDR SQ4KOU TEST"/>
                </Directory>
              </Directory>
              <Feature Id="MainFeature" Title="NereusSDR SQ4KOU TEST" Level="1">
                <ComponentGroupRef Id="AppFiles"/>
              </Feature>
            </Product>
          </Wix>
          '@ | Set-Content -Encoding UTF8 Product.wxs

      - name: Build SQ4KOU MSI
        shell: pwsh
        run: |
          heat.exe dir deploy -nologo -gg -sfrag -srd -sreg -dr INSTALLFOLDER -cg AppFiles -var var.DeployDir -out Harvest.wxs
          candle.exe -nologo -arch x64 -dDeployDir="$((Resolve-Path deploy).Path)" Product.wxs Harvest.wxs
          light.exe -nologo -out "NereusSDR-0.5.2.1-test-SQ4KOU-Windows-x64.msi" Product.wixobj Harvest.wixobj
          if ($LASTEXITCODE -ne 0) { throw "WiX light.exe failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "NereusSDR-0.5.2.1-test-SQ4KOU-Windows-x64.msi")) { throw "MSI was not produced" }
          Get-FileHash "NereusSDR-0.5.2.1-test-SQ4KOU-Windows-x64.msi" -Algorithm SHA256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            NereusSDR-*.zip
            NereusSDR-*-setup.exe
            NereusSDR-*.msi
          retention-days: 7

